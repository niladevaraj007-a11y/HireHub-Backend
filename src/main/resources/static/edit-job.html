<script>

/* =========================================================
   LOGIN CHECK
========================================================= */

const user =
    JSON.parse(
        localStorage.getItem("user")
    );


if (!user) {

    window.location.href =
        "login.html";

}


/* =========================================================
   RECRUITER CHECK
========================================================= */

if (
    user &&
    user.role !== "RECRUITER"
) {

    window.location.href =
        "jobs.html";

}


/* =========================================================
   GET JOB ID
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const jobId =
    params.get("id");


/* =========================================================
   RECRUITER DATA
========================================================= */

let companyId = null;

let recruiterProfile = null;

let currentJob = null;


/* =========================================================
   SHOW INITIAL ERROR IF NO JOB ID
========================================================= */

if (!jobId) {

    showPageError(
        "Job ID was not provided."
    );

}


/* =========================================================
   LOAD RECRUITER PROFILE
========================================================= */

async function loadRecruiterProfile() {

    try {

        if (
            !user ||
            !user.userId
        ) {

            throw new Error(
                "Recruiter login information not found."
            );

        }


        const response =
            await fetch(
                `/api/recruiters/user/${encodeURIComponent(
                    user.userId
                )}`
            );


        if (!response.ok) {

            throw new Error(
                "Recruiter profile not found."
            );

        }


        recruiterProfile =
            await response.json();


        if (
            recruiterProfile.companyId === null ||
            recruiterProfile.companyId === undefined
        ) {

            throw new Error(
                "Recruiter is not associated with a company."
            );

        }


        companyId =
            Number(
                recruiterProfile.companyId
            );


        if (
            !Number.isInteger(companyId) ||
            companyId <= 0
        ) {

            throw new Error(
                "Invalid company ID."
            );

        }


        await loadCompanyInfo();


        return true;

    }
    catch (error) {

        console.error(
            "Recruiter profile error:",
            error
        );


        showPageError(
            error.message
        );


        return false;

    }

}


/* =========================================================
   LOAD COMPANY
========================================================= */

async function loadCompanyInfo() {

    try {

        const response =
            await fetch(
                `/api/companies/${encodeURIComponent(
                    companyId
                )}`
            );


        if (!response.ok) {

            document.getElementById(
                "companyName"
            ).textContent =
                "Company #" +
                companyId;

            return;

        }


        const company =
            await response.json();


        document.getElementById(
            "companyName"
        ).textContent =
            company.companyName ||
            "Company #" +
            companyId;


        document.getElementById(
            "companyLocation"
        ).textContent =
            company.location
                ? "📍 " + company.location
                : "";

    }
    catch (error) {

        console.error(
            "Company loading error:",
            error
        );


        document.getElementById(
            "companyName"
        ).textContent =
            "Company #" +
            companyId;

    }

}


/* =========================================================
   LOAD JOB
========================================================= */

async function loadJob() {

    try {

        const response =
            await fetch(
                `/api/jobs/${encodeURIComponent(
                    jobId
                )}`
            );


        if (!response.ok) {

            throw new Error(
                "Job not found."
            );

        }


        const job =
            await response.json();


        currentJob =
            job;


        /*
         * IMPORTANT:
         * Check the actual recruiter company,
         * not hard-coded companyId = 1.
         */

        if (
            job.companyId !== null &&
            job.companyId !== undefined &&
            Number(job.companyId) !== companyId
        ) {

            throw new Error(
                "You cannot edit this job because it belongs to another company."
            );

        }


        document.getElementById(
            "title"
        ).value =
            job.title || "";


        document.getElementById(
            "location"
        ).value =
            job.location || "";


        document.getElementById(
            "jobType"
        ).value =
            job.jobType || "FULL_TIME";


        document.getElementById(
            "experience"
        ).value =
            job.experienceRequired ?? 0;


        document.getElementById(
            "vacancies"
        ).value =
            job.vacancies ?? 1;


        document.getElementById(
            "minSalary"
        ).value =
            job.minSalary ?? 0;


        document.getElementById(
            "maxSalary"
        ).value =
            job.maxSalary ?? 0;


        document.getElementById(
            "status"
        ).value =
            job.status || "OPEN";


        document.getElementById(
            "requiredSkills"
        ).value =
            job.requiredSkills || "";


        document.getElementById(
            "description"
        ).value =
            job.description || "";


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "jobForm"
        ).style.display =
            "block";


        console.log(
            "Editing job:",
            job
        );


        console.log(
            "Recruiter companyId:",
            companyId
        );


    }
    catch (error) {

        console.error(
            "Load job error:",
            error
        );


        showPageError(
            error.message
        );

    }

}


/* =========================================================
   UPDATE JOB
========================================================= */

document
    .getElementById("jobForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            await updateJob();

        }
    );


async function updateJob() {

    const saveBtn =
        document.getElementById(
            "saveBtn"
        );


    const message =
        document.getElementById(
            "message"
        );


    if (!companyId) {

        showError(
            "Company information is not available."
        );

        return;

    }


    if (!currentJob) {

        showError(
            "Job information is not loaded."
        );

        return;

    }


    /*
     * Extra ownership protection.
     */

    if (
        currentJob.companyId !== null &&
        currentJob.companyId !== undefined &&
        Number(currentJob.companyId) !== companyId
    ) {

        showError(
            "You cannot update a job belonging to another company."
        );

        return;

    }


    const title =
        document.getElementById(
            "title"
        ).value.trim();


    const location =
        document.getElementById(
            "location"
        ).value.trim();


    const jobType =
        document.getElementById(
            "jobType"
        ).value;


    const experience =
        Number(
            document.getElementById(
                "experience"
            ).value
        );


    const vacancies =
        Number(
            document.getElementById(
                "vacancies"
            ).value
        );


    const minSalary =
        Number(
            document.getElementById(
                "minSalary"
            ).value
        );


    const maxSalary =
        Number(
            document.getElementById(
                "maxSalary"
            ).value
        );


    const status =
        document.getElementById(
            "status"
        ).value;


    const requiredSkills =
        document.getElementById(
            "requiredSkills"
        ).value.trim();


    const description =
        document.getElementById(
            "description"
        ).value.trim();


    /* ================= VALIDATION ================= */

    if (!title) {

        showError(
            "Job title is required."
        );

        return;

    }


    if (!location) {

        showError(
            "Location is required."
        );

        return;

    }


    if (!jobType) {

        showError(
            "Please select a job type."
        );

        return;

    }


    if (
        Number.isNaN(experience) ||
        experience < 0
    ) {

        showError(
            "Please enter a valid experience."
        );

        return;

    }


    if (
        Number.isNaN(vacancies) ||
        vacancies < 1
    ) {

        showError(
            "Vacancies must be at least 1."
        );

        return;

    }


    if (
        Number.isNaN(minSalary) ||
        minSalary < 0
    ) {

        showError(
            "Please enter a valid minimum salary."
        );

        return;

    }


    if (
        Number.isNaN(maxSalary) ||
        maxSalary < 0
    ) {

        showError(
            "Please enter a valid maximum salary."
        );

        return;

    }


    if (
        maxSalary < minSalary
    ) {

        showError(
            "Maximum salary cannot be less than minimum salary."
        );

        return;

    }


    if (!requiredSkills) {

        showError(
            "Required skills are required."
        );

        return;

    }


    if (!description) {

        showError(
            "Job description is required."
        );

        return;

    }


    /* ================= UPDATED JOB ================= */

    const updatedJob = {

        companyId:
            companyId,

        title:
            title,

        description:
            description,

        experienceRequired:
            experience,

        location:
            location,

        minSalary:
            minSalary,

        maxSalary:
            maxSalary,

        jobType:
            jobType,

        requiredSkills:
            requiredSkills,

        status:
            status,

        vacancies:
            vacancies

    };


    console.log(
        "Updating job:",
        updatedJob
    );


    saveBtn.disabled =
        true;


    saveBtn.textContent =
        "Saving...";


    message.className =
        "";


    message.textContent =
        "";


    try {

    	const response = await fetch(
    		    `/api/jobs/${encodeURIComponent(jobId)}?recruiterUserId=${encodeURIComponent(user.userId)}`,
    		    {
    		        method: "PUT",

    		        headers: {
    		            "Content-Type": "application/json"
    		        },

    		        body: JSON.stringify(updatedJob)
    		    }
    		);


        const contentType =
            response.headers.get(
                "content-type"
            ) || "";


        let data;


        if (
            contentType.includes(
                "application/json"
            )
        ) {

            data =
                await response.json();

        }
        else {

            data =
                await response.text();

        }


        if (!response.ok) {

            throw new Error(
                typeof data === "string"
                    ? data
                    : data.message ||
                      data.error ||
                      "Unable to update job."
            );

        }


        console.log(
            "Updated job:",
            data
        );


        message.className =
            "success";


        message.textContent =
            "✓ Job updated successfully!";


        saveBtn.textContent =
            "Saved ✓";


        setTimeout(
            function() {

                window.location.href =
                    "recruiter.html";

            },
            1000
        );


    }
    catch (error) {

        console.error(
            "Update job error:",
            error
        );


        message.className =
            "error";


        message.textContent =
            error.message ||
            "Unable to update job.";


        saveBtn.disabled =
            false;


        saveBtn.textContent =
            "Save Changes";

    }

}


/* =========================================================
   DELETE JOB
========================================================= */

async function deleteJob() {

    const confirmed =
        confirm(
            "Are you sure you want to delete this job? This action cannot be undone."
        );


    if (!confirmed) {

        return;

    }


    const deleteBtn =
        document.getElementById(
            "deleteBtn"
        );


    const message =
        document.getElementById(
            "message"
        );


    /*
     * Prevent deleting a job that is
     * not owned by the recruiter.
     */

    if (
        !companyId ||
        !currentJob ||
        (
            currentJob.companyId !== null &&
            currentJob.companyId !== undefined &&
            Number(currentJob.companyId) !== companyId
        )
    ) {

        showError(
            "You cannot delete this job."
        );

        return;

    }


    deleteBtn.disabled =
        true;


    deleteBtn.textContent =
        "Deleting...";


    try {

    	const response = await fetch(
    		    `/api/jobs/${encodeURIComponent(jobId)}?recruiterUserId=${encodeURIComponent(user.userId)}`,
    		    {
    		        method: "DELETE"
    		    }
    		);

        const result =
            await response.text();


        if (!response.ok) {

            throw new Error(
                result ||
                "Unable to delete job."
            );

        }


        message.className =
            "success";


        message.textContent =
            "✓ Job deleted successfully.";


        setTimeout(
            function() {

                window.location.href =
                    "recruiter.html";

            },
            800
        );


    }
    catch (error) {

        console.error(
            "Delete job error:",
            error
        );


        message.className =
            "error";


        message.textContent =
            error.message ||
            "Unable to delete job.";


        deleteBtn.disabled =
            false;


        deleteBtn.textContent =
            "Delete Job";

    }

}


/* =========================================================
   SHOW ERROR
========================================================= */

function showError(
    text
) {

    const message =
        document.getElementById(
            "message"
        );


    message.className =
        "error";


    message.textContent =
        text;

}


/* =========================================================
   PAGE ERROR
========================================================= */

function showPageError(
    text
) {

    const loading =
        document.getElementById(
            "loading"
        );


    if (!loading) {

        return;

    }


    loading.innerHTML = `

        <div class="error">

            ❌ ${escapeHtml(
                text
            )}

            <br><br>

            <a
                href="recruiter.html"
                class="back">

                ← Back to Dashboard

            </a>

        </div>

    `;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";
    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   BACK
========================================================= */

function goBack() {

    window.location.href =
        "recruiter.html";

}


/* =========================================================
   LOGOUT
========================================================= */

function logout() {

    localStorage.removeItem(
        "user"
    );

    window.location.href =
        "login.html";

}


/* =========================================================
   START
========================================================= */

(async function startEditJobPage() {

    if (!jobId) {

        return;

    }


    const recruiterReady =
        await loadRecruiterProfile();


    if (!recruiterReady) {

        return;

    }


    await loadJob();

})();

</script>
