
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HireHub - Recruiter Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top left,
                    #312e81,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #1e3a8a,
                    transparent 35%
                ),
                #050816;

            color: #ffffff;
        }

        /* ================= NAVBAR ================= */

        nav {
            height: 70px;
            padding: 0 7%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(5, 8, 22, 0.96);

            border-bottom:
                1px solid
                rgba(99, 102, 241, 0.25);

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #818cf8;
        }

        .logo span {
            color: #ffffff;
        }

        .nav-links {
            display: flex;
            gap: 22px;
            align-items: center;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #a5b4fc;
        }

        .logout {
            color: #f87171 !important;
            cursor: pointer;
        }

        /* ================= MAIN ================= */

        .container {
            width: 86%;
            max-width: 1200px;
            margin: 45px auto 80px;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header h1 span {
            color: #818cf8;
        }

        .header p {
            color: #94a3b8;
            font-size: 15px;
        }

        /* ================= COMPANY INFO ================= */

        .company-banner {
            background:
                rgba(15, 23, 42, 0.92);

            border:
                1px solid #293354;

            border-radius: 14px;

            padding: 16px 20px;

            margin-bottom: 25px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;
        }

        .company-label {
            color: #64748b;
            font-size: 11px;

            text-transform: uppercase;

            margin-bottom: 5px;
        }

        .company-name {
            color: #c7d2fe;

            font-size: 18px;

            font-weight: bold;
        }

        .company-location {
            color: #94a3b8;

            font-size: 12px;

            margin-top: 4px;
        }

        .recruiter-info {
            color: #64748b;

            font-size: 12px;

            text-align: right;
        }

        /* ================= STATS ================= */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;

            margin-bottom: 30px;
        }

        .stat {
            background:
                rgba(15, 23, 42, 0.92);

            border:
                1px solid #293354;

            border-radius: 14px;

            padding: 22px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.18);
        }

        .stat-label {
            color: #64748b;

            font-size: 13px;

            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;

            font-weight: bold;

            color: #a5b4fc;
        }

        /* ================= COMMON SECTION ================= */

        .section {
            background:
                rgba(15, 23, 42, 0.94);

            border:
                1px solid #293354;

            border-radius: 18px;

            overflow: hidden;

            margin-bottom: 30px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.20);
        }

        .section-header {
            padding: 22px 25px;

            border-bottom:
                1px solid #293354;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;
        }

        .section-header h2 {
            font-size: 21px;
        }

        .section-count {
            color: #64748b;
            font-size: 13px;
        }

        /* ================= JOB LIST ================= */

        .job-list {
            padding: 20px;
        }

        .job-card {
            background:
                #0b1220;

            border:
                1px solid #24304d;

            border-radius: 13px;

            padding: 22px;

            margin-bottom: 15px;

            transition: 0.2s;
        }

        .job-card:last-child {
            margin-bottom: 0;
        }

        .job-card:hover {
            border-color: #6366f1;

            background:
                rgba(79, 70, 229, 0.05);
        }

        .job-top {
            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 20px;

            margin-bottom: 15px;
        }

        .job-title {
            font-size: 20px;

            font-weight: bold;

            margin-bottom: 7px;
        }

        .job-meta {
            color: #94a3b8;

            font-size: 13px;

            line-height: 1.8;
        }

        .job-description {
            color: #64748b;

            font-size: 12px;

            line-height: 1.6;

            margin-top: 7px;

            max-width: 750px;
        }

        .job-status {
            display: inline-block;

            padding: 7px 12px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

            white-space: nowrap;
        }

        .job-status.open {
            color: #4ade80;

            background:
                rgba(34, 197, 94, 0.10);

            border:
                1px solid
                rgba(34, 197, 94, 0.25);
        }

        .job-status.closed {
            color: #f87171;

            background:
                rgba(239, 68, 68, 0.10);

            border:
                1px solid
                rgba(239, 68, 68, 0.25);
        }

        .job-status.other {
            color: #a5b4fc;

            background:
                rgba(99, 102, 241, 0.10);

            border:
                1px solid
                rgba(99, 102, 241, 0.25);
        }

        .job-bottom {
            display: flex;

            justify-content: space-between;

            align-items: center;

            flex-wrap: wrap;

            gap: 15px;

            border-top:
                1px solid #1e293b;

            padding-top: 15px;
        }

        .salary {
            color: #4ade80;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 5px;
        }

        .vacancies {
            color: #94a3b8;

            font-size: 13px;
        }

        .job-actions {
            display: flex;

            flex-wrap: wrap;

            gap: 8px;
        }

        .action-btn {
            padding: 9px 13px;

            border-radius: 8px;

            font-size: 12px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .applicant-btn {
            border:
                1px solid #4f46e5;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #6366f1
                );

            color: #ffffff;
        }

        .edit-btn {
            border:
                1px solid #475569;

            background:
                #111827;

            color: #cbd5e1;
        }

        .delete-btn {
            border:
                1px solid #7f1d1d;

            background:
                rgba(127, 29, 29, 0.15);

            color: #f87171;
        }

        .action-btn:hover {
            transform:
                translateY(-1px);
        }

        .applicant-btn:hover {
            box-shadow:
                0 8px 20px
                rgba(79, 70, 229, 0.25);
        }

        .edit-btn:hover {
            border-color: #818cf8;

            color: #a5b4fc;
        }

        .delete-btn:hover {
            background:
                rgba(239, 68, 68, 0.12);

            border-color: #ef4444;
        }

        .action-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ================= APPLICANTS ================= */

        #applicantSection {
            display: none;
        }

        .applicant-card {
            padding: 25px;

            border-bottom:
                1px solid #1e293b;
        }

        .applicant-card:last-child {
            border-bottom: none;
        }

        .applicant-header {
            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 20px;

            margin-bottom: 20px;
        }

        .candidate-name {
            font-size: 21px;

            font-weight: bold;

            color: #ffffff;

            margin-bottom: 6px;
        }

        .candidate-headline {
            color: #a5b4fc;

            font-size: 14px;

            margin-bottom: 8px;
        }

        .candidate-contact {
            color: #94a3b8;

            font-size: 13px;

            line-height: 1.8;
        }

        /* ================= CANDIDATE DETAILS ================= */

        .candidate-details {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 12px;

            margin-bottom: 18px;
        }

        .detail-box {
            background:
                #0b1220;

            border:
                1px solid #24304d;

            border-radius: 10px;

            padding: 14px;
        }

        .detail-label {
            display: block;

            color: #64748b;

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 0.5px;

            margin-bottom: 6px;
        }

        .detail-value {
            color: #cbd5e1;

            font-size: 13px;

            line-height: 1.45;

            word-break: break-word;
        }

        /* ================= ABOUT ================= */

        .about-box {
            background:
                #0b1220;

            border:
                1px solid #24304d;

            border-radius: 10px;

            padding: 15px;

            margin-bottom: 18px;
        }

        .about-title {
            color: #818cf8;

            font-size: 12px;

            font-weight: bold;

            margin-bottom: 8px;
        }

        .about-text {
            color: #94a3b8;

            font-size: 13px;

            line-height: 1.7;
        }

        /* ================= APPLICANT ACTIONS ================= */

        .applicant-actions {
            display: flex;

            align-items: center;

            flex-wrap: wrap;

            gap: 10px;
        }

        .resume-name {
            color: #c7d2fe;

            font-size: 13px;

            background:
                rgba(99, 102, 241, 0.08);

            border:
                1px solid
                rgba(129, 140, 248, 0.20);

            padding: 8px 11px;

            border-radius: 7px;
        }

        .resume-btn {
            padding: 9px 13px;

            border:
                1px solid #334155;

            border-radius: 7px;

            background:
                #111827;

            color: #cbd5e1;

            cursor: pointer;

            font-size: 12px;

            transition: 0.2s;
        }

        .resume-btn:hover {
            border-color: #818cf8;

            color: #a5b4fc;
        }

        .status-select {
            padding: 9px 11px;

            background:
                #111827;

            color: white;

            border:
                1px solid #334155;

            border-radius: 7px;

            outline: none;

            font-size: 12px;

            cursor: pointer;
        }

        .status-select:focus {
            border-color: #818cf8;
        }

        .status-select option {
            background:
                #111827;

            color: white;
        }

        .status-message {
            font-size: 12px;
        }

        .success-message {
            color: #4ade80;
        }

        .error-message {
            color: #f87171;
        }

        .application-meta {
            color: #64748b;

            font-size: 12px;

            margin-top: 15px;

            padding-top: 12px;

            border-top:
                1px solid #1e293b;
        }

        /* ================= LOADING ================= */

        .loading {
            text-align: center;

            padding: 50px;

            color: #64748b;
        }

        .empty {
            text-align: center;

            padding: 50px;

            color: #64748b;
        }

        .error {
            text-align: center;

            padding: 50px;

            color: #f87171;

            line-height: 1.6;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 950px) {

            .candidate-details {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .job-top,
            .applicant-header {
                flex-direction: column;
            }

            .container {
                width: 92%;
            }

            .nav-links a:not(.logout) {
                display: none;
            }

            .header h1 {
                font-size: 29px;
            }

            .company-banner {
                align-items: flex-start;
                flex-direction: column;
            }

            .recruiter-info {
                text-align: left;
            }

        }

        @media (max-width: 600px) {

            .candidate-details {
                grid-template-columns: 1fr;
            }

            .job-actions {
                width: 100%;
            }

            .job-actions .action-btn {
                flex: 1;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav>

    <div class="logo">
        Hire<span>Hub</span>
    </div>

    <div class="nav-links">

        <a
            href="recruiter.html"
            class="active">
            Dashboard
        </a>

        <a href="create-job.html">
            Post Job
        </a>

        <a href="profile.html">
            Profile
        </a>

        <a
            class="logout"
            onclick="logout()">
            Logout
        </a>

    </div>

</nav>


<!-- ================= MAIN ================= -->

<div class="container">


    <div class="header">

        <h1>
            Recruiter <span>Dashboard</span>
        </h1>

        <p>
            Manage your jobs, review candidates,
            and update application status.
        </p>

    </div>


    <!-- ================= COMPANY ================= -->

    <div
        id="companyBanner"
        class="company-banner">

        <div>

            <div class="company-label">
                Company
            </div>

            <div
                id="companyName"
                class="company-name">

                Loading company...

            </div>

            <div
                id="companyLocation"
                class="company-location">
            </div>

        </div>


        <div
            id="recruiterInfo"
            class="recruiter-info">
        </div>

    </div>


    <!-- ================= STATS ================= -->

    <div class="stats">

        <div class="stat">

            <div class="stat-label">
                Total Jobs
            </div>

            <div
                class="stat-value"
                id="jobCount">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Total Applicants
            </div>

            <div
                class="stat-value"
                id="applicantCount">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Shortlisted
            </div>

            <div
                class="stat-value"
                id="shortlistedCount">
                0
            </div>

        </div>

    </div>


    <!-- ================= JOBS ================= -->

    <div class="section">

        <div class="section-header">

            <h2>
                My Jobs
            </h2>

            <span
                class="section-count"
                id="jobText">

                Loading...

            </span>

        </div>


        <div
            id="jobsList"
            class="job-list">

            <div class="loading">
                Loading jobs...
            </div>

        </div>

    </div>


    <!-- ================= APPLICANTS ================= -->

    <div
        class="section"
        id="applicantSection">

        <div class="section-header">

            <h2 id="applicantTitle">
                Applicants
            </h2>

            <span
                class="section-count"
                id="applicantText">
            </span>

        </div>


        <div id="applicantsList">
        </div>

    </div>


</div>


<script>

/* =========================================================
   LOGIN CHECK
========================================================= */

const user =
    JSON.parse(
        localStorage.getItem("user")
    );


if (!user) {

    window.location.href =
        "login.html";

}


/* =========================================================
   RECRUITER CHECK
========================================================= */

if (
    user &&
    user.role !== "RECRUITER"
) {

    window.location.href =
        "jobs.html";

}


/* =========================================================
   RECRUITER COMPANY
========================================================= */

let companyId = null;

let recruiterProfile = null;


/* =========================================================
   LOAD RECRUITER PROFILE
========================================================= */

async function loadRecruiterProfile() {

    if (
        !user ||
        !user.userId
    ) {

        window.location.href =
            "login.html";

        return false;

    }


    try {

        const response =
            await fetch(
                `/api/recruiters/user/${encodeURIComponent(
                    user.userId
                )}`
            );


        if (!response.ok) {

            throw new Error(
                "Recruiter profile not found."
            );

        }


        recruiterProfile =
            await response.json();


        if (
            recruiterProfile.companyId === null ||
            recruiterProfile.companyId === undefined
        ) {

            throw new Error(
                "Recruiter is not associated with a company."
            );

        }


        companyId =
            Number(
                recruiterProfile.companyId
            );


        if (
            !Number.isInteger(
                companyId
            ) ||
            companyId <= 0
        ) {

            throw new Error(
                "Invalid company ID."
            );

        }


        await loadCompanyInfo();


        console.log(
            "Recruiter profile:",
            recruiterProfile
        );

        console.log(
            "Company ID:",
            companyId
        );


        return true;

    }
    catch (error) {

        console.error(
            "Recruiter profile error:",
            error
        );


        document.getElementById(
            "companyName"
        ).textContent =
            "Company unavailable";


        document.getElementById(
            "jobsList"
        ).innerHTML = `

            <div class="error">

                ❌ ${escapeHtml(
                    error.message
                )}

            </div>

        `;


        return false;

    }

}


/* =========================================================
   LOAD COMPANY INFORMATION
========================================================= */

async function loadCompanyInfo() {

    try {

        const response =
            await fetch(
                `/api/companies/${encodeURIComponent(
                    companyId
                )}`
            );


        if (!response.ok) {

            document.getElementById(
                "companyName"
            ).textContent =
                "Company #" +
                companyId;


            document.getElementById(
                "recruiterInfo"
            ).textContent =
                recruiterProfile.designation ||
                "";

            return;

        }


        const company =
            await response.json();


        document.getElementById(
            "companyName"
        ).textContent =
            company.companyName ||
            "Company #" +
            companyId;


        document.getElementById(
            "companyLocation"
        ).textContent =
            company.location
                ? "📍 " + company.location
                : "";


        document.getElementById(
            "recruiterInfo"
        ).textContent =
            recruiterProfile.designation ||
            "";

    }
    catch (error) {

        console.error(
            "Company loading error:",
            error
        );


        document.getElementById(
            "companyName"
        ).textContent =
            "Company #" +
            companyId;


        document.getElementById(
            "recruiterInfo"
        ).textContent =
            recruiterProfile.designation ||
            "";

    }

}


/* =========================================================
   LOAD JOBS
========================================================= */

async function loadJobs() {

    if (!companyId) {

        return;

    }


    try {

        const response =
            await fetch(
                `/api/jobs/company/${encodeURIComponent(
                    companyId
                )}`
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load recruiter jobs."
            );

        }


        const jobs =
            await response.json();


        document.getElementById(
            "jobCount"
        ).textContent =
            jobs.length;


        document.getElementById(
            "jobText"
        ).textContent =
            jobs.length +
            (
                jobs.length === 1
                    ? " job"
                    : " jobs"
            );


        renderJobs(
            jobs
        );


        await calculateApplicationStats(
            jobs
        );


    }
    catch (error) {

        console.error(
            "Jobs error:",
            error
        );


        document.getElementById(
            "jobsList"
        ).innerHTML = `

            <div class="error">

                ❌ ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


/* =========================================================
   RENDER JOBS
========================================================= */

function renderJobs(
    jobs
) {

    const container =
        document.getElementById(
            "jobsList"
        );


    if (
        !jobs ||
        jobs.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                No jobs posted yet.

                <br><br>

                <a
                    href="create-job.html"
                    style="
                        color:#818cf8;
                        text-decoration:none;
                    ">

                    + Post a New Job

                </a>

            </div>

        `;

        return;

    }


    container.innerHTML =
        "";


    jobs.forEach(
        job => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "job-card";


            const status =
                job.status ||
                "OPEN";


            let statusClass =
                "other";


            if (
                status === "OPEN"
            ) {

                statusClass =
                    "open";

            }
            else if (
                status === "CLOSED"
            ) {

                statusClass =
                    "closed";

            }


            const description =
                job.description ||
                "";


            card.innerHTML = `

                <div class="job-top">


                    <div>


                        <div class="job-title">

                            ${escapeHtml(
                                job.title ||
                                "Untitled Job"
                            )}

                        </div>


                        <div class="job-meta">

                            📍
                            ${escapeHtml(
                                job.location ||
                                "Not specified"
                            )}

                            <br>

                            💼
                            ${escapeHtml(
                                formatJobType(
                                    job.jobType
                                )
                            )}

                            <br>

                            ⭐
                            Experience:
                            ${job.experienceRequired ?? 0}
                            years

                            <br>

                            🛠️
                            ${escapeHtml(
                                job.requiredSkills ||
                                "Not specified"
                            )}

                        </div>


                        ${
                            description
                                ? `
                                    <div
                                        class="job-description">

                                        ${escapeHtml(
                                            description
                                        )}

                                    </div>
                                  `
                                : ""
                        }


                    </div>


                    <div
                        class="
                            job-status
                            ${statusClass}
                        ">

                        ${escapeHtml(
                            status
                        )}

                    </div>


                </div>


                <div class="job-bottom">


                    <div>

                        <div class="salary">

                            ₹${formatSalary(
                                job.minSalary
                            )}

                            -

                            ₹${formatSalary(
                                job.maxSalary
                            )}

                        </div>


                        <div class="vacancies">

                            ${job.vacancies ?? 0}
                            vacancies

                        </div>

                    </div>


                    <div class="job-actions">


                        <button
                            type="button"
                            class="
                                action-btn
                                edit-btn
                            "
                            onclick="
                                editJob(
                                    ${job.jobId}
                                )
                            ">

                            Edit Job

                        </button>


                        <button
                            type="button"
                            class="

}

/* =========================================================
   DELETE JOB
========================================================= */

async function deleteJob(
    jobId,
    jobTitle
) {

    const confirmed =
        confirm(
            `Are you sure you want to delete "${jobTitle}"?\n\n` +
            "This action cannot be undone."
        );


    if (!confirmed) {

        return;

    }


    const deleteButton =
        [...document.querySelectorAll(
            ".delete-btn"
        )].find(
            button =>
                button
                    .getAttribute("onclick")
                    ?.includes(
                        `deleteJob(${jobId},`
                    )
        );


    if (deleteButton) {

        deleteButton.disabled =
            true;

        deleteButton.textContent =
            "Deleting...";

    }


    try {

        /*
         * IMPORTANT:
         *
         * Backend requires:
         *
         * ?recruiterUserId=1
         */

        const response =
            await fetch(
                `/api/jobs/${encodeURIComponent(
                    jobId
                )}?recruiterUserId=${encodeURIComponent(
                    user.userId
                )}`,
                {
                    method: "DELETE"
                }
            );


        const result =
            await response.text();


        if (!response.ok) {

            throw new Error(
                result ||
                "Unable to delete job."
            );

        }


        alert(
            "Job deleted successfully."
        );


        document.getElementById(
            "applicantSection"
        ).style.display =
            "none";


        await loadJobs();


    }
    catch (error) {

        console.error(
            "Delete job error:",
            error
        );


        alert(
            error.message ||
            "Unable to delete job."
        );


        if (deleteButton) {

            deleteButton.disabled =
                false;

            deleteButton.textContent =
                "Delete";

        }

    }

}


/* =========================================================
   LOAD APPLICANTS
========================================================= */

async function loadApplicants(
    jobId,
    jobTitle
) {

    const section =
        document.getElementById(
            "applicantSection"
        );


    const container =
        document.getElementById(
            "applicantsList"
        );


    section.style.display =
        "block";


    document.getElementById(
        "applicantTitle"
    ).textContent =
        "Applicants - " +
        jobTitle;


    document.getElementById(
        "applicantText"
    ).textContent =
        "";


    container.innerHTML = `

        <div class="loading">

            Loading applicants...

        </div>

    `;


    section.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });


    try {

        const response =
            await fetch(
                `/api/applications/job/${encodeURIComponent(
                    jobId
                )}`
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load applicants."
            );

        }


        const applications =
            await response.json();


        document.getElementById(
            "applicantText"
        ).textContent =
            applications.length +
            (
                applications.length === 1
                    ? " applicant"
                    : " applicants"
            );


        await renderApplicants(
            applications
        );


    }
    catch (error) {

        console.error(
            "Applicants error:",
            error
        );


        container.innerHTML = `

            <div class="error">

                ❌ ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


/* =========================================================
   GET APPLICANT
========================================================= */

async function getApplicant(
    applicationId
) {

    try {

        const response =
            await fetch(
                `/api/applications/${encodeURIComponent(
                    applicationId
                )}/applicant`
            );


        if (!response.ok) {

            return null;

        }


        return await response.json();

    }
    catch (error) {

        console.error(
            "Applicant API error:",
            error
        );

        return null;

    }

}


/* =========================================================
   RENDER APPLICANTS
========================================================= */

async function renderApplicants(
    applications
) {

    const container =
        document.getElementById(
            "applicantsList"
        );


    if (
        !applications ||
        applications.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                No applicants for this job yet.

            </div>

        `;

        return;

    }


    container.innerHTML = `

        <div class="loading">

            Loading candidate details...

        </div>

    `;


    const applicantData =
        await Promise.all(

            applications.map(
                async application => {

                    const applicant =
                        await getApplicant(
                            application.applicationId
                        );


                    return {
                        application,
                        applicant
                    };

                }
            )

        );


    container.innerHTML =
        "";


    applicantData.forEach(
        ({
            application,
            applicant
        }) => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "applicant-card";


            if (!applicant) {

                card.innerHTML = `

                    <div class="error">

                        Unable to load candidate
                        details for Application
                        #${application.applicationId}.

                    </div>

                `;


                container.appendChild(
                    card
                );


                return;

            }


            const status =
                applicant.status ||
                "APPLIED";


            const resumeName =
                applicant.resumeFileName ||
                "No resume attached";


            card.innerHTML = `

                <div class="applicant-header">


                    <div>

                        <div class="candidate-name">

                            ${escapeHtml(
                                applicant.fullName ||
                                "Candidate"
                            )}

                        </div>


                        <div class="candidate-headline">

                            ${escapeHtml(
                                applicant.headline ||
                                "Job Seeker"
                            )}

                        </div>


                        <div class="candidate-contact">

                            📧
                            ${escapeHtml(
                                applicant.email ||
                                "Email not available"
                            )}

                            <br>

                            📱
                            ${escapeHtml(
                                applicant.phone ||
                                "Phone not available"
                            )}

                        </div>

                    </div>


                    <div>

                        <span
                            class="
                                job-status
                                ${getStatusClass(
                                    status
                                )}
                            ">

                            ${escapeHtml(
                                status
                            )}

                        </span>

                    </div>


                </div>


                <div class="candidate-details">


                    <div class="detail-box">

                        <span class="detail-label">
                            Location
                        </span>

                        <div class="detail-value">

                            📍
                            ${escapeHtml(
                                applicant.location ||
                                "Not specified"
                            )}

                        </div>

                    </div>


                    <div class="detail-box">

                        <span class="detail-label">
                            Education
                        </span>

                        <div class="detail-value">

                            🎓
                            ${escapeHtml(
                                applicant.education ||
                                "Not specified"
                            )}

                        </div>

                    </div>


                    <div class="detail-box">

                        <span class="detail-label">
                            Experience
                        </span>

                        <div class="detail-value">

                            ⭐
                            ${applicant.experienceYears ?? 0}
                            years

                        </div>

                    </div>


                    <div class="detail-box">

                        <span class="detail-label">
                            Resume
                        </span>

                        <div class="detail-value">

                            📄
                            ${escapeHtml(
                                resumeName
                            )}

                        </div>

                    </div>


                </div>


                <div class="about-box">

                    <div class="about-title">
                        About Candidate
                    </div>

                    <div class="about-text">

                        ${escapeHtml(
                            applicant.about ||
                            "No candidate description provided."
                        )}

                    </div>

                </div>


                <div class="applicant-actions">


                    ${
                        applicant.resumeId
                            ? `

                                <div class="resume-name">

                                    📄
                                    ${escapeHtml(
                                        applicant.resumeFileName ||
                                        "Resume"

                                <button

/* =========================================================
   UPDATE APPLICATION STATUS
========================================================= */

async function updateStatus(
    applicationId,
    newStatus,
    selectElement
) {

    const message =
        document.getElementById(
            `status-message-${applicationId}`
        );


    if (!message) {

        return;

    }


    selectElement.disabled =
        true;


    message.className =
        "status-message";


    message.textContent =
        "Updating...";


    try {

        const response =
            await fetch(
                `/api/applications/${encodeURIComponent(
                    applicationId
                )}/status?status=${encodeURIComponent(
                    newStatus
                )}`,
                {
                    method: "PUT"
                }
            );


        const contentType =
            response.headers.get(
                "content-type"
            ) || "";


        let data;


        if (
            contentType.includes(
                "application/json"
            )
        ) {

            data =
                await response.json();

        }
        else {

            data =
                await response.text();

        }


        if (!response.ok) {

            throw new Error(
                typeof data === "string"
                    ? data
                    : data.message ||
                      data.error ||
                      "Unable to update status."
            );

        }


        message.className =
            "status-message success-message";


        message.textContent =
            "Updated ✓";


        const card =
            selectElement.closest(
                ".applicant-card"
            );


        if (card) {

            const badge =
                card.querySelector(
                    ".applicant-header .job-status"
                );


            if (badge) {

                badge.textContent =
                    newStatus;


                badge.className =
                    "job-status " +
                    getStatusClass(
                        newStatus
                    );

            }

        }


        await calculateApplicationStats();


        setTimeout(
            function() {

                message.textContent =
                    "";

            },
            2000
        );


    }
    catch (error) {

        console.error(
            "Status update error:",
            error
        );


        message.className =
            "status-message error-message";


        message.textContent =
            error.message ||
            "Unable to update status.";

    }


    selectElement.disabled =
        false;

}


/* =========================================================
   STATUS CLASS
========================================================= */

function getStatusClass(
    status
) {

    if (
        status === "APPLIED"
    ) {

        return "other";

    }


    if (
        status === "SHORTLISTED"
    ) {

        return "open";

    }


    if (
        status === "REJECTED"
    ) {

        return "closed";

    }


    return "other";

}


/* =========================================================
   APPLICATION STATS
========================================================= */

async function calculateApplicationStats(
    jobs
) {

    if (!companyId) {

        return;

    }


    try {

        if (!jobs) {

            const response =
                await fetch(
                    `/api/jobs/company/${encodeURIComponent(
                        companyId
                    )}`
                );


            if (!response.ok) {

                return;

            }


            jobs =
                await response.json();

        }


        let totalApplicants =
            0;


        let totalShortlisted =
            0;


        for (
            const job of jobs
        ) {

            try {

                const response =
                    await fetch(
                        `/api/applications/job/${encodeURIComponent(
                            job.jobId
                        )}`
                    );


                if (!response.ok) {

                    continue;

                }


                const applications =
                    await response.json();


                totalApplicants +=
                    applications.length;


                totalShortlisted +=
                    applications.filter(
                        application =>
                            application.status ===
                            "SHORTLISTED"
                    ).length;


            }
            catch (error) {

                console.error(
                    "Stats job error:",
                    error
                );

            }

        }


        document.getElementById(
            "applicantCount"
        ).textContent =
            totalApplicants;


        document.getElementById(
            "shortlistedCount"
        ).textContent =
            totalShortlisted;


    }
    catch (error) {

        console.error(
            "Stats error:",
            error
        );

    }

}

/* =========================================================
   FORMAT SALARY
========================================================= */

function formatSalary(
    value
) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return "0";

    }


    const number =
        Number(value);


    if (
        Number.isNaN(number)
    ) {

        return "0";

    }


    return number.toLocaleString(
        "en-IN"
    );

}


/* =========================================================
   FORMAT JOB TYPE
========================================================= */

function formatJobType(
    value
) {

    if (!value) {

        return "Not specified";

    }


    return String(value)
        .replace(
            /_/g,
            " "
        )
        .toLowerCase()
        .replace(
            /\b\w/g,
            letter =>
                letter.toUpperCase()
        );

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(
    value
) {

    if (!value) {

        return "Not available";

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return String(value);

    }


    return date.toLocaleString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";
    }


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   ESCAPE JAVASCRIPT STRING
========================================================= */

function escapeJs(
    value
) {

    return String(
        value ?? ""
    )
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /"/g,
            '\\"'
        )
        .replace(
            /\r/g,
            "\\r"
        )
        .replace(
            /\n/g,
            "\\n"
        );

}
