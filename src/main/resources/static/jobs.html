<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HireHub - Find Jobs</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top left,
                    #312e81,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #1e3a8a,
                    transparent 35%
                ),
                #050816;

            color: white;
        }

        /* ================= NAVBAR ================= */

        nav {
            height: 70px;
            padding: 0 7%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background:
                rgba(5, 8, 22, 0.96);

            border-bottom:
                1px solid
                rgba(99, 102, 241, 0.25);

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #818cf8;
        }

        .logo span {
            color: white;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #a5b4fc;
        }

        .logout {
            color: #f87171 !important;
            cursor: pointer;
        }

        /* ================= MAIN ================= */

        .container {
            width: 88%;
            max-width: 1200px;
            margin: 45px auto 80px;
        }

        .header {
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header h1 span {
            color: #818cf8;
        }

        .header p {
            color: #94a3b8;
            font-size: 15px;
        }

        /* ================= FILTER CARD ================= */

        .filter-card {
            background:
                rgba(15, 23, 42, 0.94);

            border:
                1px solid #293354;

            border-radius: 18px;

            padding: 22px;

            margin-bottom: 28px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.20);
        }

        .filter-title {
            font-size: 17px;
            margin-bottom: 16px;
        }

        .filter-grid {
            display: grid;

            grid-template-columns:
                2fr
                1.2fr
                1.1fr
                1fr
                1fr;

            gap: 12px;
        }

        .input-group label {
            display: block;

            color: #94a3b8;

            font-size: 11px;

            margin-bottom: 6px;

            text-transform: uppercase;
        }

        input,
        select {
            width: 100%;

            padding: 11px 12px;

            background:
                #0f172a;

            color: white;

            border:
                1px solid #334155;

            border-radius: 8px;

            outline: none;

            font-family: inherit;

            font-size: 13px;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus,
        select:focus {
            border-color: #818cf8;

            box-shadow:
                0 0 0 3px
                rgba(129, 140, 248, 0.10);
        }

        select option {
            background: #0f172a;
            color: white;
        }

        .filter-actions {
            display: flex;

            gap: 10px;

            margin-top: 15px;

            flex-wrap: wrap;
        }

        .search-btn,
        .clear-btn {
            padding: 10px 17px;

            border-radius: 8px;

            font-size: 13px;

            font-weight: bold;

            cursor: pointer;
        }

        .search-btn {
            border: none;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            color: white;
        }

        .search-btn:hover {
            box-shadow:
                0 8px 20px
                rgba(79, 70, 229, 0.25);
        }

        .clear-btn {
            border:
                1px solid #334155;

            background:
                #111827;

            color: #cbd5e1;
        }

        .clear-btn:hover {
            border-color: #818cf8;
            color: #a5b4fc;
        }

        /* ================= RESULTS HEADER ================= */

        .results-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 15px;
        }

        .results-header h2 {
            font-size: 21px;
        }

        .result-count {
            color: #64748b;
            font-size: 13px;
        }

        /* ================= JOB LIST ================= */

        #jobsList {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;
        }

        .job-card {
            background:
                rgba(15, 23, 42, 0.94);

            border:
                1px solid #293354;

            border-radius: 16px;

            padding: 23px;

            transition: 0.2s;

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.15);
        }

        .job-card:hover {
            border-color:
                #6366f1;

            transform:
                translateY(-2px);

            box-shadow:
                0 18px 40px
                rgba(79, 70, 229, 0.15);
        }

        .job-top {
            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 12px;

            margin-bottom: 15px;
        }

        .job-title {
            font-size: 20px;

            font-weight: bold;

            margin-bottom: 6px;
        }

        .company {
            color: #a5b4fc;

            font-size: 13px;

            margin-bottom: 10px;
        }

        .job-location {
            color: #94a3b8;

            font-size: 13px;

            line-height: 1.7;
        }

        .status {
            padding: 6px 10px;

            border-radius: 20px;

            font-size: 10px;

            font-weight: bold;

            white-space: nowrap;
        }

        .status-open {
            color: #4ade80;

            background:
                rgba(34, 197, 94, 0.10);

            border:
                1px solid
                rgba(34, 197, 94, 0.25);
        }

        .status-closed {
            color: #f87171;

            background:
                rgba(239, 68, 68, 0.10);

            border:
                1px solid
                rgba(239, 68, 68, 0.25);
        }

        .status-other {
            color: #a5b4fc;

            background:
                rgba(99, 102, 241, 0.10);

            border:
                1px solid
                rgba(99, 102, 241, 0.25);
        }

        /* ================= META ================= */

        .meta-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 9px;

            margin: 17px 0;
        }

        .meta-box {
            background:
                #0b1220;

            border:
                1px solid #24304d;

            border-radius: 8px;

            padding: 11px;
        }

        .meta-label {
            display: block;

            color: #64748b;

            font-size: 10px;

            text-transform: uppercase;

            margin-bottom: 5px;
        }

        .meta-value {
            color: #cbd5e1;

            font-size: 13px;
        }

        /* ================= SKILLS ================= */

        .skills {
            display: flex;

            flex-wrap: wrap;

            gap: 7px;

            margin-bottom: 17px;
        }

        .skill {
            padding: 6px 9px;

            border-radius: 6px;

            background:
                rgba(99, 102, 241, 0.10);

            border:
                1px solid
                rgba(129, 140, 248, 0.20);

            color: #c7d2fe;

            font-size: 11px;
        }

        .skill.match {
            border-color:
                rgba(74, 222, 128, 0.35);

            color: #86efac;

            background:
                rgba(34, 197, 94, 0.08);
        }

        /* ================= DESCRIPTION ================= */

        .description {
            color: #94a3b8;

            font-size: 13px;

            line-height: 1.7;

            margin-bottom: 18px;

            display: -webkit-box;

            -webkit-line-clamp: 3;

            -webkit-box-orient: vertical;

            overflow: hidden;
        }

        /* ================= ACTIONS ================= */

        .job-actions {
            display: flex;

            gap: 9px;

            padding-top: 15px;

            border-top:
                1px solid #1e293b;
        }

        .view-btn,
        .apply-btn {
            flex: 1;

            padding: 11px;

            border-radius: 8px;

            font-size: 12px;

            font-weight: bold;

            cursor: pointer;
        }

        .view-btn {
            border:
                1px solid #334155;

            background:
                #111827;

            color: #cbd5e1;
        }

        .view-btn:hover {
            border-color: #818cf8;
            color: #a5b4fc;
        }

        .apply-btn {
            border: none;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            color: white;
        }

        .apply-btn:hover {
            box-shadow:
                0 8px 20px
                rgba(79, 70, 229, 0.25);
        }

        .apply-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* ================= STATES ================= */

        .loading,
        .empty,
        .error {
            grid-column: 1 / -1;

            text-align: center;

            padding: 60px 20px;

            color: #64748b;
        }

        .error {
            color: #f87171;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 1000px) {

            .filter-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            #jobsList {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 700px) {

            .container {
                width: 92%;
            }

            .filter-grid {
                grid-template-columns: 1fr;
            }

            .nav-links a:not(.logout) {
                display: none;
            }

            .header h1 {
                font-size: 29px;
            }

            .job-top {
                flex-direction: column;
            }

            .results-header {
                align-items: flex-start;
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav>

    <div class="logo">
        Hire<span>Hub</span>
    </div>


    <div class="nav-links">

        <a
            href="jobs.html"
            class="active">
            Jobs
        </a>

        <a href="applications.html">
            My Applications
        </a>

        <a href="profile.html">
            Profile
        </a>

        <a
            class="logout"
            onclick="logout()">
            Logout
        </a>

    </div>

</nav>


<!-- ================= MAIN ================= -->

<div class="container">


    <div class="header">

        <h1>
            Find Your <span>Next Job</span>
        </h1>

        <p>
            Search and filter opportunities that match your skills and career goals.
        </p>

    </div>


    <!-- ================= FILTERS ================= -->

    <div class="filter-card">

        <div class="filter-title">
            Search Jobs
        </div>


        <div class="filter-grid">


            <div class="input-group">

                <label for="search">
                    Job Title / Keyword
                </label>

                <input
                    type="text"
                    id="search"
                    placeholder="Java Developer, SQL, Backend...">

            </div>


            <div class="input-group">

                <label for="location">
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    placeholder="Bangalore">

            </div>


            <div class="input-group">

                <label for="jobType">
                    Job Type
                </label>

                <select id="jobType">

                    <option value="">
                        All Types
                    </option>

                    <option value="FULL_TIME">
                        Full Time
                    </option>

                    <option value="PART_TIME">
                        Part Time
                    </option>

                    <option value="INTERNSHIP">
                        Internship
                    </option>

                    <option value="CONTRACT">
                        Contract
                    </option>

                </select>

            </div>


            <div class="input-group">

                <label for="minSalary">
                    Minimum Salary
                </label>

                <input
                    type="number"
                    id="minSalary"
                    min="0"
                    placeholder="300000">

            </div>


            <div class="input-group">

                <label for="maxSalary">
                    Maximum Salary
                </label>

                <input
                    type="number"
                    id="maxSalary"
                    min="0"
                    placeholder="600000">

            </div>


        </div>


        <div class="filter-actions">

            <button
                type="button"
                class="search-btn"
                onclick="applyFilters()">

                Search Jobs

            </button>


            <button
                type="button"
                class="clear-btn"
                onclick="clearFilters()">

                Clear Filters

            </button>

        </div>

    </div>


    <!-- ================= RESULTS ================= -->

    <div class="results-header">

        <h2>
            Available Jobs
        </h2>

        <span
            id="resultCount"
            class="result-count">
            Loading...
        </span>

    </div>


    <div id="jobsList">

        <div class="loading">
            Loading jobs...
        </div>

    </div>


</div>


<script>

/* =========================================================
   LOGIN
========================================================= */

const user =
    JSON.parse(
        localStorage.getItem("user")
    );


if (!user) {

    window.location.href =
        "login.html";

}


/* =========================================================
   DATA
========================================================= */

let allJobs = [];

let filteredJobs = [];


/* =========================================================
   LOAD JOBS
========================================================= */

async function loadJobs() {

    const container =
        document.getElementById(
            "jobsList"
        );


    container.innerHTML = `

        <div class="loading">

            Loading jobs...

        </div>

    `;


    try {

        const response =
            await fetch(
                "/api/jobs"
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load jobs."
            );

        }


        allJobs =
            await response.json();


        /*
            Only show OPEN jobs to seekers.
        */

        allJobs =
            allJobs.filter(
                job =>
                    !job.status ||
                    job.status === "OPEN"
            );


        applyFilters();


    }
    catch (error) {

        console.error(
            "Job loading error:",
            error
        );


        container.innerHTML = `

            <div class="error">

                ❌ ${escapeHtml(
                    error.message
                )}

            </div>

        `;

        document.getElementById(
            "resultCount"
        ).textContent =
            "Unable to load jobs";

    }

}


/* =========================================================
   APPLY FILTERS
========================================================= */

function applyFilters() {

    const search =
        document.getElementById(
            "search"
        ).value
        .trim()
        .toLowerCase();


    const location =
        document.getElementById(
            "location"
        ).value
        .trim()
        .toLowerCase();


    const jobType =
        document.getElementById(
            "jobType"
        ).value;


    const minSalaryInput =
        document.getElementById(
            "minSalary"
        ).value;


    const maxSalaryInput =
        document.getElementById(
            "maxSalary"
        ).value;


    const minSalary =
        minSalaryInput
            ? Number(
                minSalaryInput
            )
            : null;


    const maxSalary =
        maxSalaryInput
            ? Number(
                maxSalaryInput
            )
            : null;


    filteredJobs =
        allJobs.filter(
            job => {

                /* ================= SEARCH ================= */

                const searchableText =
                    [
                        job.title,
                        job.description,
                        job.location,
                        job.requiredSkills,
                        job.jobType
                    ]
                        .filter(
                            value =>
                                value !== null &&
                                value !== undefined
                        )
                        .join(" ")
                        .toLowerCase();


                if (
                    search &&
                    !searchableText.includes(
                        search
                    )
                ) {

                    return false;

                }


                /* ================= LOCATION ================= */

                if (
                    location &&
                    !String(
                        job.location || ""
                    )
                        .toLowerCase()
                        .includes(
                            location
                        )
                ) {

                    return false;

                }


                /* ================= JOB TYPE ================= */

                if (
                    jobType &&
                    job.jobType !==
                    jobType
                ) {

                    return false;

                }


                /* ================= SALARY ================= */

                const jobMin =
                    Number(
                        job.minSalary || 0
                    );


                const jobMax =
                    Number(
                        job.maxSalary || 0
                    );


                if (
                    minSalary !== null &&
                    jobMax < minSalary
                ) {

                    return false;

                }


                if (
                    maxSalary !== null &&
                    jobMin > maxSalary
                ) {

                    return false;

                }


                return true;

            }
        );


    renderJobs(
        filteredJobs,
        search
    );

}


/* =========================================================
   RENDER JOBS
========================================================= */

function renderJobs(
    jobs,
    searchTerm = ""
) {

    const container =
        document.getElementById(
            "jobsList"
        );


    const resultCount =
        document.getElementById(
            "resultCount"
        );


    resultCount.textContent =
        jobs.length +
        (
            jobs.length === 1
                ? " job"
                : " jobs"
        );


    if (
        !jobs ||
        jobs.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                No jobs match your search.

                <br><br>

                Try changing your filters.

            </div>

        `;

        return;

    }


    container.innerHTML =
        "";


    jobs.forEach(
        job => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "job-card";


            /* ================= STATUS ================= */

            const status =
                job.status ||
                "OPEN";


            let statusClass =
                "status-other";


            if (
                status === "OPEN"
            ) {

                statusClass =
                    "status-open";

            }
            else if (
                status === "CLOSED"
            ) {

                statusClass =
                    "status-closed";

            }


            /* ================= SKILLS ================= */

            const skills =
                String(
                    job.requiredSkills ||
                    ""
                )
                .split(",")
                .map(
                    skill =>
                        skill.trim()
                )
                .filter(
                    skill =>
                        skill.length > 0
                );


            const skillsHtml =
                skills.length > 0
                    ? skills
                        .map(
                            skill => {

                                const isMatch =
                                    searchTerm &&
                                    skill
                                        .toLowerCase()
                                        .includes(
                                            searchTerm
                                        );


                                return `

                                    <span
                                        class="
                                            skill
                                            ${isMatch
                                                ? "match"
                                                : ""}
                                        ">

                                        ${escapeHtml(
                                            skill
                                        )}

                                    </span>

                                `;

                            }
                        )
                        .join("")
                    : `

                        <span class="skill">

                            No skills specified

                        </span>

                      `;


            /* ================= CARD ================= */

            card.innerHTML = `

                <div class="job-top">


                    <div>

                        <div class="job-title">

                            ${escapeHtml(
                                job.title ||
                                "Untitled Job"
                            )}

                        </div>


                        <div class="company">

                            HireHub Company

                        </div>


                        <div class="job-location">

                            📍
                            ${escapeHtml(
                                job.location ||
                                "Location not specified"
                            )}

                        </div>

                    </div>


                    <span
                        class="
                            status
                            ${statusClass}
                        ">

                        ${escapeHtml(
                            status
                        )}

                    </span>


                </div>


                <div class="meta-grid">


                    <div class="meta-box">

                        <span class="meta-label">
                            Salary
                        </span>

                        <div class="meta-value">

                            ₹${formatSalary(
                                job.minSalary
                            )}
                            -
                            ₹${formatSalary(
                                job.maxSalary
                            )}

                        </div>

                    </div>


                    <div class="meta-box">

                        <span class="meta-label">
                            Job Type
                        </span>

                        <div class="meta-value">

                            ${formatJobType(
                                job.jobType
                            )}

                        </div>

                    </div>


                    <div class="meta-box">

                        <span class="meta-label">
                            Experience
                        </span>

                        <div class="meta-value">

                            ${job.experienceRequired ?? 0}
                            years

                        </div>

                    </div>


                    <div class="meta-box">

                        <span class="meta-label">
                            Vacancies
                        </span>

                        <div class="meta-value">

                            ${job.vacancies ?? 0}

                        </div>

                    </div>


                </div>


                <div class="skills">

                    ${skillsHtml}

                </div>


                <div class="description">

                    ${escapeHtml(
                        job.description ||
                        "No job description available."
                    )}

                </div>


                <div class="job-actions">


                    <button
                        type="button"
                        class="view-btn"
                        onclick="
                            viewJob(
                                ${job.jobId}
                            )
                        ">

                        View Details

                    </button>


                    <button
                        type="button"
                        class="apply-btn"
                        onclick="
                            viewJob(
                                ${job.jobId}
                            )
                        "
                        ${status !== "OPEN"
                            ? "disabled"
                            : ""}>

                        ${status === "OPEN"
                            ? "Apply Now"
                            : "Closed"}

                    </button>


                </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   VIEW JOB
========================================================= */

function viewJob(
    jobId
) {

    window.location.href =
        "job-details.html?id=" +
        encodeURIComponent(
            jobId
        );

}


/* =========================================================
   CLEAR FILTERS
========================================================= */

function clearFilters() {

    document.getElementById(
        "search"
    ).value =
        "";


    document.getElementById(
        "location"
    ).value =
        "";


    document.getElementById(
        "jobType"
    ).value =
        "";


    document.getElementById(
        "minSalary"
    ).value =
        "";


    document.getElementById(
        "maxSalary"
    ).value =
        "";


    applyFilters();

}


/* =========================================================
   ENTER KEY SEARCH
========================================================= */

document
    .getElementById("search")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                event.preventDefault();

                applyFilters();

            }

        }
    );


document
    .getElementById("location")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                event.preventDefault();

                applyFilters();

            }

        }
    );


/* =========================================================
   FORMAT SALARY
========================================================= */

function formatSalary(
    value
) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return "0";

    }


    return Number(
        value
    )
        .toLocaleString(
            "en-IN"
        );

}


/* =========================================================
   FORMAT JOB TYPE
========================================================= */

function formatJobType(
    value
) {

    if (!value) {

        return "Not specified";

    }


    return String(
        value
    )
        .replace(
            /_/g,
            " "
        )
        .toLowerCase()
        .replace(
            /\b\w/g,
            letter =>
                letter.toUpperCase()
        );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";
    }


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}

    localStorage.removeItem(

    );
