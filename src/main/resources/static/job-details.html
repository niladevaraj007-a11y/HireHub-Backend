<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HireHub - Job Details</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top left,
                    #312e81,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #1e3a8a,
                    transparent 35%
                ),
                #050816;

            color: #ffffff;
        }

        /* ================= NAVBAR ================= */

        nav {
            height: 70px;
            padding: 0 7%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(5, 8, 22, 0.96);

            border-bottom:
                1px solid rgba(99, 102, 241, 0.25);

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #818cf8;
        }

        .logo span {
            color: #ffffff;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .nav-links a:hover {
            color: #a5b4fc;
        }

        .logout {
            color: #f87171 !important;
            cursor: pointer;
        }

        /* ================= MAIN ================= */

        .container {
            width: 86%;
            max-width: 1100px;
            margin: 50px auto;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;

            color: #a5b4fc;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }

        /* ================= JOB HEADER ================= */

        .job-header {
            background: rgba(15, 23, 42, 0.92);

            border: 1px solid #293354;
            border-radius: 18px;

            padding: 35px;
            margin-bottom: 25px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .job-icon {
            width: 65px;
            height: 65px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    rgba(79, 70, 229, 0.25),
                    rgba(124, 58, 237, 0.15)
                );

            border-radius: 14px;

            font-size: 28px;
            margin-bottom: 20px;
        }

        .job-header h1 {
            font-size: 34px;
            margin-bottom: 12px;
        }

        .company {
            color: #a5b4fc;
            margin-bottom: 18px;
        }

        .job-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .meta {
            padding: 9px 13px;

            background: #111827;

            border: 1px solid #293354;

            border-radius: 7px;

            color: #cbd5e1;

            font-size: 13px;
        }

        /* ================= GRID ================= */

        .content-grid {
            display: grid;

            grid-template-columns:
                1fr 330px;

            gap: 25px;
        }

        /* ================= CONTENT ================= */

        .content-card {
            background: rgba(15, 23, 42, 0.92);

            border: 1px solid #293354;

            border-radius: 16px;

            padding: 28px;

            margin-bottom: 20px;
        }

        .content-card h2 {
            font-size: 20px;
            margin-bottom: 18px;
        }

        .content-card p {
            color: #94a3b8;

            line-height: 1.7;
            font-size: 14px;
        }

        /* ================= SKILLS ================= */

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill {
            padding: 7px 11px;

            background:
                rgba(99, 102, 241, 0.12);

            border:
                1px solid rgba(129, 140, 248, 0.30);

            color: #c7d2fe;

            border-radius: 7px;

            font-size: 13px;
        }

        /* ================= APPLY CARD ================= */

        .apply-card {
            background:
                rgba(15, 23, 42, 0.96);

            border:
                1px solid #293354;

            border-radius: 16px;

            padding: 25px;

            position: sticky;
            top: 95px;

            height: fit-content;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .apply-card h2 {
            margin-bottom: 8px;
        }

        .apply-card .small {
            color: #64748b;

            font-size: 13px;

            line-height: 1.5;

            margin-bottom: 22px;
        }

        .resume-label {
            display: block;

            color: #cbd5e1;

            font-size: 13px;

            margin-bottom: 8px;
        }

        select {
            width: 100%;

            padding: 12px;

            background: #111827;

            color: white;

            border:
                1px solid #334155;

            border-radius: 8px;

            outline: none;

            margin-bottom: 15px;
        }

        select:focus {
            border-color: #818cf8;

            box-shadow:
                0 0 0 2px
                rgba(129, 140, 248, 0.15);
        }

        select option {
            background: #111827;
            color: white;
        }

        /* ================= BUTTON ================= */

        .apply-btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            color: white;

            font-weight: bold;

            font-size: 15px;

            cursor: pointer;

            transition: 0.2s;
        }

        .apply-btn:hover:not(:disabled) {
            transform: translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(99, 102, 241, 0.35);
        }

        .apply-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ================= MESSAGE ================= */

        #message {
            margin-top: 15px;

            text-align: center;

            font-size: 13px;

            line-height: 1.5;

            min-height: 20px;
        }

        .success {
            color: #4ade80;
        }

        .error {
            color: #f87171;
        }

        .info {
            color: #60a5fa;
        }

        /* ================= LOADING ================= */

        .loading {
            text-align: center;

            padding: 60px;

            color: #94a3b8;
        }

        .error-page {
            color: #f87171;

            text-align: center;

            padding: 50px;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 800px) {

            .container {
                width: 92%;
            }

            .content-grid {
                grid-template-columns: 1fr;
            }

            .apply-card {
                position: static;
            }

            .nav-links {
                gap: 12px;
            }

            .nav-links a:not(.logout) {
                display: none;
            }

            .job-header h1 {
                font-size: 27px;
            }

            .job-header {
                padding: 25px;
            }
        }

    </style>

</head>


<body>

<!-- ================= NAVBAR ================= -->

<nav>

    <div class="logo">
        Hire<span>Hub</span>
    </div>

    <div class="nav-links">

        <a href="jobs.html">
            Jobs
        </a>

        <a href="applications.html">
            My Applications
        </a>

        <a href="profile.html">
            Profile
        </a>

        <a
            class="logout"
            onclick="logout()">
            Logout
        </a>

    </div>

</nav>


<!-- ================= MAIN ================= -->

<div class="container">

    <a
        href="jobs.html"
        class="back">
        ← Back to Jobs
    </a>


    <div id="jobContainer">

        <div class="loading">
            Loading job details...
        </div>

    </div>

</div>


<script>

/* =========================================================
   1. CHECK LOGIN
========================================================= */

const user =
    JSON.parse(
        localStorage.getItem("user")
    );


if (!user) {

    window.location.href =
        "login.html";

}


/*
    IMPORTANT:

    user.userId = database users.user_id
    user.seekerId = database job_seekers.seeker_id

    For Nila:

    userId   = 3
    seekerId = 2
*/

const seekerId =
    user ? user.seekerId : null;


/* =========================================================
   2. GET JOB ID
========================================================= */

const urlParams =
    new URLSearchParams(
        window.location.search
    );

const jobId =
    urlParams.get("id");


/* =========================================================
   3. VALIDATE USER + JOB
========================================================= */

if (!user) {

    showError(
        "Please login before viewing this job."
    );

}
else if (!seekerId) {

    showError(
        "Your account does not contain a seeker ID. Please logout and login again."
    );

}
else if (!jobId) {

    showError(
        "Job ID is missing."
    );

}
else {

    loadJob();

}


/* =========================================================
   4. SHOW ERROR
========================================================= */

function showError(message) {

    document.getElementById(
        "jobContainer"
    ).innerHTML = `

        <div class="error-page">
            ❌ ${message}
        </div>

    `;

}


/* =========================================================
   5. LOAD JOB
========================================================= */

async function loadJob() {

    try {

        console.log("Logged-in user:", user);
        console.log("User ID:", user.userId);
        console.log("Seeker ID:", seekerId);
        console.log("Job ID:", jobId);


        const response =
            await fetch(
                `/api/jobs/${encodeURIComponent(jobId)}`
            );


        if (!response.ok) {

            throw new Error(
                "Job not found."
            );

        }


        const job =
            await response.json();


        displayJob(job);


    }
    catch (error) {

        console.error(
            "Job loading error:",
            error
        );


        showError(
            error.message ||
            "Unable to load job details."
        );

    }

}


/* =========================================================
   6. DISPLAY JOB
========================================================= */

function displayJob(job) {

    document.getElementById(
        "jobContainer"
    ).innerHTML = `

        <div class="job-header">

            <div class="job-icon">
                💼
            </div>

            <h1>
                ${escapeHtml(job.title)}
            </h1>

            <div class="company">
                HireHub Company
            </div>

            <div class="job-meta">

                <div class="meta">
                    📍 ${escapeHtml(job.location)}
                </div>

                <div class="meta">
                    💰 ₹${formatSalary(job.minSalary)}
                    -
                    ₹${formatSalary(job.maxSalary)}
                </div>

                <div class="meta">
                    💼 ${escapeHtml(job.jobType)}
                </div>

                <div class="meta">
                    👥 ${job.vacancies} vacancies
                </div>

                <div class="meta">
                    ⭐ ${job.experienceRequired}
                    years experience
                </div>

            </div>

        </div>


        <div class="content-grid">


            <!-- LEFT SIDE -->

            <div>

                <div class="content-card">

                    <h2>
                        Job Description
                    </h2>

                    <p>
                        ${escapeHtml(
                            job.description ||
                            "No description available."
                        )}
                    </p>

                </div>


                <div class="content-card">

                    <h2>
                        Required Skills
                    </h2>

                    <div
                        class="skills"
                        id="skills">

                    </div>

                </div>

            </div>


            <!-- RIGHT SIDE -->

            <div class="apply-card">

                <h2>
                    Apply for this job
                </h2>

                <p class="small">
                    Select the resume you want to
                    submit with this application.
                </p>


                <label
                    class="resume-label"
                    for="resumeSelect">

                    Select Resume

                </label>


                <select id="resumeSelect">

                    <option value="">
                        Loading resumes...
                    </option>

                </select>


                <button
                    id="applyBtn"
                    class="apply-btn"
                    onclick="applyForJob()"
                    disabled>

                    Apply Now

                </button>


                <div id="message"></div>

            </div>

        </div>

    `;


    /* =====================================================
       DISPLAY SKILLS
    ===================================================== */

    const skillsContainer =
        document.getElementById("skills");


    if (job.requiredSkills) {

        job.requiredSkills
            .split(",")
            .forEach(skill => {

                const span =
                    document.createElement("span");

                span.className = "skill";

                span.textContent =
                    skill.trim();

                skillsContainer.appendChild(
                    span
                );

            });

    }
    else {

        const span =
            document.createElement("span");

        span.className = "skill";

        span.textContent =
            "Not specified";

        skillsContainer.appendChild(
            span
        );

    }


    /*
        IMPORTANT:

        resumeSelect now exists.
        Only now do we load resumes.
    */

    loadResumes();

}


/* =========================================================
   7. LOAD RESUMES
========================================================= */

async function loadResumes() {

    const resumeSelect =
        document.getElementById(
            "resumeSelect"
        );

    const applyBtn =
        document.getElementById(
            "applyBtn"
        );

    const message =
        document.getElementById(
            "message"
        );


    if (!resumeSelect) {

        console.error(
            "resumeSelect was not created."
        );

        return;

    }


    try {

        console.log(
            "Requesting resumes for seeker:",
            seekerId
        );


        /*
            IMPORTANT:
            This must be /seeker/2 for Nila,
            NOT /seeker/3.
        */

        const response =
            await fetch(
                `/api/resumes/seeker/${encodeURIComponent(seekerId)}`
            );


        console.log(
            "Resume API status:",
            response.status
        );


        if (!response.ok) {

            throw new Error(
                "Unable to load resumes."
            );

        }


        const resumes =
            await response.json();


        console.log(
            "Resumes returned:",
            resumes
        );


        /* Clear dropdown */

        resumeSelect.innerHTML = "";


        /* No resumes */

        if (
            !Array.isArray(resumes) ||
            resumes.length === 0
        ) {

            resumeSelect.innerHTML = `

                <option value="">
                    No resume available
                </option>

            `;

            applyBtn.disabled = true;

            message.className = "error";

            message.textContent =
                "No resume found for this job seeker.";

            return;

        }


        /* Default option */

        const defaultOption =
            document.createElement("option");

        defaultOption.value = "";

        defaultOption.textContent =
            "Select Resume";

        resumeSelect.appendChild(
            defaultOption
        );


        /* Add every resume */

        resumes.forEach(resume => {

            const option =
                document.createElement("option");


            option.value =
                String(resume.resumeId);


            option.textContent =
                resume.fileName;


            resumeSelect.appendChild(
                option
            );

        });


        /* Clear message */

        message.textContent = "";


        /*
            Enable button only after
            a resume is selected.
        */

        resumeSelect.onchange =
            function() {

                applyBtn.disabled =
                    !this.value;

            };


    }
    catch (error) {

        console.error(
            "Resume loading error:",
            error
        );


        resumeSelect.innerHTML = `

            <option value="">
                Unable to load resumes
            </option>

        `;

        applyBtn.disabled = true;

        message.className = "error";

        message.textContent =
            error.message ||
            "Unable to load resumes.";

    }

}


/* =========================================================
   8. APPLY FOR JOB
========================================================= */

async function applyForJob() {

    const resumeSelect =
        document.getElementById("resumeSelect");

    const applyBtn =
        document.getElementById("applyBtn");

    const message =
        document.getElementById("message");

    const resumeId =
        resumeSelect.value;


    if (!resumeId) {

        message.className = "error";

        message.textContent =
            "Please select a resume.";

        return;
    }


    applyBtn.disabled = true;

    applyBtn.textContent =
        "Applying...";

    message.className = "";

    message.textContent = "";


    try {

        const response =
            await fetch(
                `/api/applications/apply?jobId=${encodeURIComponent(jobId)}&seekerId=${encodeURIComponent(seekerId)}&resumeId=${encodeURIComponent(resumeId)}`,
                {
                    method: "POST"
                }
            );


        const contentType =
            response.headers.get("content-type") || "";


        let data;


        if (
            contentType.includes("application/json")
        ) {

            data = await response.json();

        } else {

            data = await response.text();

        }


        if (!response.ok) {

            const errorMessage =
                typeof data === "string"
                    ? data
                    : data.message ||
                      data.error ||
                      "Application failed.";

            throw new Error(errorMessage);
        }


        message.className =
            "success";

        message.textContent =
            "✓ Application submitted successfully!";


        applyBtn.textContent =
            "Applied ✓";


        setTimeout(() => {

            window.location.href =
                "applications.html";

        }, 1200);


    } catch (error) {

        console.error(
            "Application error:",
            error
        );


        message.className =
            "error";

        message.textContent =
            error.message ||
            "Unable to submit application.";


        applyBtn.disabled =
            false;

        applyBtn.textContent =
            "Apply Now";
    }
}


/* =========================================================
   9. FORMAT SALARY
========================================================= */

function formatSalary(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "0";
    }

    return Number(value)
        .toLocaleString("en-IN");

}


/* =========================================================
   10. ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    if (value === null ||
        value === undefined) {

        return "";

    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   11. LOGOUT
========================================================= */

function logout() {

    localStorage.removeItem(
        "user"
    );

    window.location.href =
        "login.html";

}

</script>

</body>

</html>
