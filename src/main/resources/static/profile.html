<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HireHub - Profile</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top left,
                    #312e81,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #1e3a8a,
                    transparent 35%
                ),
                #050816;

            color: white;
        }

        /* ================= NAVBAR ================= */

        nav {
            height: 70px;
            padding: 0 7%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background:
                rgba(5, 8, 22, 0.96);

            border-bottom:
                1px solid
                rgba(99, 102, 241, 0.25);

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #818cf8;
        }

        .logo span {
            color: white;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #a5b4fc;
        }

        .logout {
            color: #f87171 !important;
            cursor: pointer;
        }

        /* ================= MAIN ================= */

        .container {
            width: 86%;
            max-width: 1000px;
            margin: 45px auto 80px;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header h1 span {
            color: #818cf8;
        }

        .header p {
            color: #94a3b8;
            font-size: 15px;
        }

        /* ================= CARD ================= */

        .profile-card {
            background:
                rgba(15, 23, 42, 0.94);

            border:
                1px solid #293354;

            border-radius: 18px;

            padding: 30px;

            margin-bottom: 25px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.25);
        }

        /* ================= PROFILE HEADER ================= */

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .avatar {
            width: 75px;
            height: 75px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            font-size: 28px;
            font-weight: bold;

            flex-shrink: 0;
        }

        .profile-name {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .profile-role {
            color: #a5b4fc;
            font-size: 13px;
        }

        /* ================= ACCOUNT INFO ================= */

        .info-grid {
            display: grid;
            grid-template-columns:
                repeat(2, 1fr);
            gap: 15px;
        }

        .info-box {
            background: #0b1220;

            border:
                1px solid #24304d;

            border-radius: 10px;

            padding: 15px;
        }

        .info-label {
            display: block;

            color: #64748b;

            font-size: 11px;

            text-transform: uppercase;

            margin-bottom: 7px;
        }

        .info-value {
            color: #cbd5e1;

            font-size: 14px;

            line-height: 1.5;

            word-break: break-word;
        }

        /* ================= TITLES ================= */

        .section-title {
            font-size: 20px;
            margin-bottom: 22px;
        }

        /* ================= PROFILE FORM ================= */

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 17px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            display: block;

            color: #cbd5e1;

            font-size: 13px;

            margin-bottom: 7px;
        }

        input,
        textarea,
        select {
            width: 100%;

            padding: 12px 13px;

            background: #0f172a;

            color: white;

            border:
                1px solid #334155;

            border-radius: 8px;

            outline: none;

            font-family: inherit;

            font-size: 14px;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #818cf8;

            box-shadow:
                0 0 0 3px
                rgba(129, 140, 248, 0.10);
        }

        select option {
            background: #0f172a;
            color: white;
        }

        /* ================= BUTTONS ================= */

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .save-btn {
            padding: 12px 20px;

            border: none;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            color: white;

            font-weight: bold;

            cursor: pointer;

            font-size: 14px;
        }

        .save-btn:hover {
            box-shadow:
                0 10px 25px
                rgba(79, 70, 229, 0.30);
        }

        .save-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            min-height: 20px;
            font-size: 13px;
        }

        .success {
            color: #4ade80;
        }

        .error {
            color: #f87171;
        }

        /* ================= RESUME UPLOAD ================= */

        .upload-box {
            background: #0b1220;

            border:
                1px solid #24304d;

            border-radius: 10px;

            padding: 18px;

            margin-bottom: 20px;
        }

        .upload-box label {
            display: block;

            color: #cbd5e1;

            font-size: 13px;

            margin-bottom: 10px;
        }

        .upload-box input[type="file"] {
            width: 100%;

            padding: 10px;

            background: #0f172a;

            color: #cbd5e1;

            border:
                1px solid #334155;

            border-radius: 8px;

            margin-bottom: 12px;

            cursor: pointer;
        }

        .upload-btn {
            padding: 10px 16px;

            border: none;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        .upload-btn:hover {
            box-shadow:
                0 8px 20px
                rgba(79, 70, 229, 0.25);
        }

        .upload-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ================= RESUME LIST ================= */

        .resume-card {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            background: #0b1220;

            border:
                1px solid #24304d;

            border-radius: 10px;

            padding: 16px;

            margin-top: 10px;
        }

        .resume-name {
            color: #c7d2fe;
            font-size: 14px;
        }

        .resume-date {
            color: #64748b;
            font-size: 11px;
            margin-top: 5px;
        }

        .resume-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .download-btn {
            padding: 9px 13px;

            border:
                1px solid #4f46e5;

            border-radius: 7px;

            background: transparent;

            color: #a5b4fc;

            cursor: pointer;

            font-size: 12px;
        }

        .download-btn:hover {
            background: #4f46e5;
            color: white;
        }

        .delete-resume-btn {
            padding: 9px 13px;

            border:
                1px solid #7f1d1d;

            border-radius: 7px;

            background:
                rgba(127, 29, 29, 0.12);

            color: #f87171;

            cursor: pointer;

            font-size: 12px;
        }

        .delete-resume-btn:hover {
            border-color: #ef4444;

            background:
                rgba(239, 68, 68, 0.12);
        }

        .empty {
            color: #64748b;
            font-size: 13px;
            padding: 15px 0;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #64748b;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            .info-grid,
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .profile-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .resume-card {
                align-items: flex-start;
                flex-direction: column;
            }

            .nav-links a:not(.logout) {
                display: none;
            }

            .container {
                width: 92%;
            }

            .header h1 {
                font-size: 29px;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav>

    <div class="logo">
        Hire<span>Hub</span>
    </div>


    <div class="nav-links">

        <a
            id="dashboardLink"
            href="jobs.html">
            Dashboard
        </a>

        <a
            id="applicationsLink"
            href="applications.html">
            My Applications
        </a>

        <a
            href="profile.html"
            class="active">
            Profile
        </a>

        <a
            class="logout"
            onclick="logout()">
            Logout
        </a>

    </div>

</nav>


<!-- ================= MAIN ================= -->

<div class="container">


    <div class="header">

        <h1>
            My <span>Profile</span>
        </h1>

        <p>
            Manage your HireHub account and professional profile.
        </p>

    </div>


    <div id="profileContainer">

        <div class="loading">
            Loading profile...
        </div>

    </div>


</div>


<script>

/* =========================================================
   LOGIN CHECK
========================================================= */

const user =
    JSON.parse(
        localStorage.getItem("user")
    );


if (!user) {

    window.location.href =
        "login.html";

}


/* =========================================================
   NAVIGATION
========================================================= */

if (
    user &&
    user.role === "RECRUITER"
) {

    document.getElementById(
        "dashboardLink"
    ).href =
        "recruiter.html";

    document.getElementById(
        "applicationsLink"
    ).style.display =
        "none";
}


/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadProfile() {

    const container =
        document.getElementById(
            "profileContainer"
        );


    try {

        renderUserProfile(
            user
        );


        if (
            user.role === "JOB_SEEKER"
        ) {

            await loadSeekerProfile();

        }

    }
    catch (error) {

        console.error(
            "Profile error:",
            error
        );

        container.innerHTML = `

            <div class="error">

                Unable to load profile.

            </div>

        `;

    }

}


/* =========================================================
   RENDER ACCOUNT INFORMATION
========================================================= */

function renderUserProfile(
    profile
) {

    const container =
        document.getElementById(
            "profileContainer"
        );


    const initials =
        getInitials(
            profile.fullName ||
            "User"
        );


    container.innerHTML = `

        <div class="profile-card">


            <div class="profile-header">


                <div class="avatar">

                    ${escapeHtml(
                        initials
                    )}

                </div>


                <div>

                    <div class="profile-name">

                        ${escapeHtml(
                            profile.fullName ||
                            "User"
                        )}

                    </div>


                    <div class="profile-role">

                        ${escapeHtml(
                            formatRole(
                                profile.role
                            )
                        )}

                    </div>

                </div>


            </div>


            <div class="info-grid">


                <div class="info-box">

                    <span class="info-label">
                        Full Name
                    </span>

                    <div class="info-value">

                        ${escapeHtml(
                            profile.fullName ||
                            "Not available"
                        )}

                    </div>

                </div>


                <div class="info-box">

                    <span class="info-label">
                        Email
                    </span>

                    <div class="info-value">

                        ${escapeHtml(
                            profile.email ||
                            "Not available"
                        )}

                    </div>

                </div>


                <div class="info-box">

                    <span class="info-label">
                        Phone
                    </span>

                    <div class="info-value">

                        ${escapeHtml(
                            profile.phone ||
                            "Not provided"
                        )}

                    </div>

                </div>


                <div class="info-box">

                    <span class="info-label">
                        Role
                    </span>

                    <div class="info-value">

                        ${escapeHtml(
                            formatRole(
                                profile.role
                            )
                        )}

                    </div>

                </div>


            </div>


        </div>

    `;

}


/* =========================================================
   LOAD JOB SEEKER PROFILE
========================================================= */

async function loadSeekerProfile() {

    const seekerId =
        user.seekerId;


    if (!seekerId) {

        console.error(
            "No seekerId found in logged-in user."
        );

        return;

    }


    try {

        const response =
            await fetch(
                `/api/job-seekers/${encodeURIComponent(
                    seekerId
                )}`
            );


        if (!response.ok) {

            throw new Error(
                "Job seeker profile not found."
            );

        }


        const seeker =
            await response.json();


        renderSeekerProfile(
            seeker
        );


        await loadResumes(
            seekerId
        );


    }
    catch (error) {

        console.error(
            "Seeker profile error:",
            error
        );

    }

}


/* =========================================================
   RENDER EDITABLE SEEKER PROFILE
========================================================= */

function renderSeekerProfile(
    seeker
) {

    const container =
        document.getElementById(
            "profileContainer"
        );


    const section =
        document.createElement(
            "div"
        );


    section.innerHTML = `

        <!-- ================= PROFESSIONAL PROFILE ================= -->

        <div class="profile-card">


            <h2 class="section-title">

                Professional Profile

            </h2>


            <form id="seekerForm">


                <div class="form-grid">


                    <div class="full">

                        <label
                            for="headline">

                            Professional Headline

                        </label>


                        <input
                            type="text"
                            id="headline"
                            placeholder="e.g. Java Full Stack Developer"
                            value="${escapeAttribute(
                                seeker.headline || ""
                            )}"
                            required>

                    </div>


                    <div>

                        <label
                            for="location">

                            Location

                        </label>


                        <input
                            type="text"
                            id="location"
                            placeholder="e.g. Bangalore"
                            value="${escapeAttribute(
                                seeker.location || ""
                            )}"
                            required>

                    </div>


                    <div>

                        <label
                            for="experience">

                            Experience (Years)

                        </label>


                        <input
                            type="number"
                            id="experience"
                            min="0"
                            step="0.1"
                            value="${seeker.experienceYears ?? 0}"
                            required>

                    </div>


                    <div class="full">

                        <label
                            for="education">

                            Education

                        </label>


                        <input
                            type="text"
                            id="education"
                            placeholder="e.g. B.E Computer Science and Engineering"
                            value="${escapeAttribute(
                                seeker.education || ""
                            )}"
                            required>

                    </div>


                    <div class="full">

                        <label
                            for="about">

                            About

                        </label>


                        <textarea
                            id="about"
                            placeholder="Tell recruiters about yourself..."
                            required>${escapeHtml(
                                seeker.about || ""
                            )}</textarea>

                    </div>


                </div>


                <div class="button-row">

                    <button
                        type="submit"
                        id="saveBtn"
                        class="save-btn">

                        Save Profile

                    </button>

                </div>


                <div
                    id="profileMessage"
                    class="message">
                </div>


            </form>


        </div>


        <!-- ================= RESUMES ================= -->

        <div class="profile-card">


            <h2 class="section-title">

                My Resumes

            </h2>


            <div class="upload-box">


                <label
                    for="resumeFile">

                    Upload New Resume

                </label>


                <input
                    type="file"
                    id="resumeFile"
                    accept=".pdf,application/pdf">


                <button
                    type="button"
                    id="uploadBtn"
                    class="upload-btn"
                    onclick="uploadResume()">

                    Upload Resume

                </button>


                <div
                    id="uploadMessage"
                    class="message">
                </div>


            </div>


            <div id="resumeList">

                <div class="loading">

                    Loading resumes...

                </div>

            </div>


        </div>

    `;


    container.appendChild(
        section
    );


    document
        .getElementById(
            "seekerForm"
        )
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                updateSeekerProfile(
                    seeker.seekerId
                );

            }
        );

}


/* =========================================================
   UPDATE SEEKER PROFILE
========================================================= */

async function updateSeekerProfile(
    seekerId
) {

    const saveBtn =
        document.getElementById(
            "saveBtn"
        );


    const message =
        document.getElementById(
            "profileMessage"
        );


    const experienceValue =
        Number(
            document.getElementById(
                "experience"
            ).value
        );


    if (
        experienceValue < 0 ||
        Number.isNaN(
            experienceValue
        )
    ) {

        message.className =
            "message error";

        message.textContent =
            "Please enter a valid experience.";

        return;

    }


    const updatedProfile = {

        headline:
            document.getElementById(
                "headline"
            ).value.trim(),

        location:
            document.getElementById(
                "location"
            ).value.trim(),

        experienceYears:
            experienceValue,

        education:
            document.getElementById(
                "education"
            ).value.trim(),

        about:
            document.getElementById(
                "about"
            ).value.trim()

    };


    saveBtn.disabled =
        true;

    saveBtn.textContent =
        "Saving...";


    message.className =
        "message";

    message.textContent =
        "";


    try {

        const response =
            await fetch(
                `/api/job-seekers/${encodeURIComponent(
                    seekerId
                )}`,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            updatedProfile
                        )
                }
            );


        const contentType =
            response.headers.get(
                "content-type"
            ) || "";


        let data;


        if (
            contentType.includes(
                "application/json"
            )
        ) {

            data =
                await response.json();

        }
        else {

            data =
                await response.text();

        }


        if (!response.ok) {

            throw new Error(
                typeof data === "string"
                    ? data
                    : data.message ||
                      data.error ||
                      "Unable to update profile."
            );

        }


        message.className =
            "message success";

        message.textContent =
            "✓ Profile updated successfully.";

    }
    catch (error) {

        console.error(
            "Profile update error:",
            error
        );


        message.className =
            "message error";

        message.textContent =
            error.message ||
            "Unable to update profile.";

    }


    saveBtn.disabled =
        false;

    saveBtn.textContent =
        "Save Profile";

}


/* =========================================================
   UPLOAD RESUME
========================================================= */

async function uploadResume() {

    const fileInput =
        document.getElementById(
            "resumeFile"
        );


    const message =
        document.getElementById(
            "uploadMessage"
        );


    const uploadButton =
        document.getElementById(
            "uploadBtn"
        );


    if (
        !fileInput ||
        !fileInput.files ||
        fileInput.files.length === 0
    ) {

        message.className =
            "message error";

        message.textContent =
            "Please select a PDF resume.";

        return;

    }


    const file =
        fileInput.files[0];


    if (
        !file.name
            .toLowerCase()
            .endsWith(".pdf")
    ) {

        message.className =
            "message error";

        message.textContent =
            "Only PDF resume files are allowed.";

        return;

    }


    uploadButton.disabled =
        true;

    uploadButton.textContent =
        "Uploading...";


    message.className =
        "message";

    message.textContent =
        "";


    const formData =
        new FormData();


    formData.append(
        "file",
        file
    );


    try {

        const response =
            await fetch(
                `/api/resumes/upload?seekerId=${encodeURIComponent(
                    user.seekerId
                )}`,
                {
                    method: "POST",
                    body: formData
                }
            );


        const contentType =
            response.headers.get(
                "content-type"
            ) || "";


        let data;


        if (
            contentType.includes(
                "application/json"
            )
        ) {

            data =
                await response.json();

        }
        else {

            data =
                await response.text();

        }


        if (!response.ok) {

            throw new Error(
                typeof data === "string"
                    ? data
                    : data.message ||
                      data.error ||
                      "Resume upload failed."
            );

        }


        message.className =
            "message success";

        message.textContent =
            "✓ Resume uploaded successfully.";


        fileInput.value =
            "";


        await loadResumes(
            user.seekerId
        );


    }
    catch (error) {

        console.error(
            "Resume upload error:",
            error
        );


        message.className =
            "message error";

        message.textContent =
            error.message ||
            "Resume upload failed.";

    }


    uploadButton.disabled =
        false;

    uploadButton.textContent =
        "Upload Resume";

}


/* =========================================================
   LOAD RESUMES
========================================================= */

async function loadResumes(
    seekerId
) {

    try {

        const response =
            await fetch(
                `/api/resumes/seeker/${encodeURIComponent(
                    seekerId
                )}`
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load resumes."
            );

        }


        const resumes =
            await response.json();


        const resumeList =
            document.getElementById(
                "resumeList"
            );


        if (!resumeList) {

            return;

        }


        if (
            !resumes ||
            resumes.length === 0
        ) {

            resumeList.innerHTML = `

                <div class="empty">

                    No resumes uploaded yet.

                </div>

            `;

            return;

        }


        resumeList.innerHTML =
            "";


        resumes.forEach(
            resume => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "resume-card";


                card.innerHTML = `

                    <div>

                        <div class="resume-name">

                            📄
                            ${escapeHtml(
                                resume.fileName
                            )}

                        </div>


                        <div class="resume-date">

                            Uploaded:
                            ${formatDate(
                                resume.uploadedAt
                            )}

                        </div>

                    </div>


                    <div
                        class="resume-actions">


                        <button
                            type="button"
                            class="download-btn"
                            onclick="
                                downloadResume(
                                    ${resume.resumeId}
                                )
                            ">

                            Download

                        </button>


                        <button
                            type="button"
                            class="delete-resume-btn"
                            onclick="
                                deleteResume(
                                    ${resume.resumeId}
                                )
                            ">

                            Delete

                        </button>


                    </div>

                `;


                resumeList.appendChild(
                    card
                );

            }
        );


    }
    catch (error) {

        console.error(
            "Resume loading error:",
            error
        );


        const resumeList =
            document.getElementById(
                "resumeList"
            );


        if (resumeList) {

            resumeList.innerHTML = `

                <div class="error">

                    Unable to load resumes.

                </div>

            `;

        }

    }

}


/* =========================================================
   DOWNLOAD RESUME
========================================================= */

function downloadResume(
    resumeId
) {

    window.open(
        `/api/resumes/${encodeURIComponent(
            resumeId
        )}/download`,
        "_blank"
    );

}


/* =========================================================
   DELETE RESUME
========================================================= */

async function deleteResume(
    resumeId
) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this resume?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                `/api/resumes/${encodeURIComponent(
                    resumeId
                )}`,
                {
                    method: "DELETE"
                }
            );


        const result =
            await response.text();


        if (!response.ok) {

            throw new Error(
                result ||
                "Unable to delete resume."
            );

        }


        alert(
            "Resume deleted successfully."
        );


        await loadResumes(
            user.seekerId
        );

    }
    catch (error) {

        console.error(
            "Delete resume error:",
            error
        );


        alert(
            error.message ||
            "Unable to delete resume."
        );

    }

}


/* =========================================================
   INITIALS
========================================================= */

function getInitials(
    name
) {

    return String(
        name
    )
        .split(" ")
        .filter(
            part =>
                part.length > 0
        )
        .slice(0, 2)
        .map(
            part =>
                part.charAt(0)
                    .toUpperCase()
        )
        .join("");

}


/* =========================================================
   ROLE
========================================================= */

function formatRole(
    role
) {

    if (
        role === "JOB_SEEKER"
    ) {

        return "Job Seeker";

    }


    if (
        role === "RECRUITER"
    ) {

        return "Recruiter";

    }


    if (
        role === "ADMIN"
    ) {

        return "Administrator";

    }


    return role || "User";

}


/* =========================================================
   DATE
========================================================= */

function formatDate(
    value
) {

    if (!value) {

        return "Not available";

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return String(
            value
        );

    }


    return date.toLocaleString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";
    }


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   ESCAPE ATTRIBUTE
========================================================= */

function escapeAttribute(
    value
) {

    return escapeHtml(
        value
    );

}


/* =========================================================
   LOGOUT
========================================================= */

function logout() {

    localStorage.removeItem(
        "user"
    );

    window.location.href =
        "login.html";

}
