
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HireHub - My Applications</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top left,
                    #312e81,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #1e3a8a,
                    transparent 35%
                ),
                #050816;

            color: #ffffff;
        }

        /* ================= NAVBAR ================= */

        nav {
            height: 70px;
            padding: 0 7%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(5, 8, 22, 0.96);

            border-bottom:
                1px solid rgba(99, 102, 241, 0.25);

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #818cf8;
        }

        .logo span {
            color: #ffffff;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #a5b4fc;
        }

        .logout {
            color: #f87171 !important;
            cursor: pointer;
        }

        /* ================= MAIN ================= */

        .container {
            width: 86%;
            max-width: 1150px;
            margin: 50px auto 80px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .page-header h1 span {
            color: #818cf8;
        }

        .page-header p {
            color: #94a3b8;
            font-size: 15px;
        }

        /* ================= STATS ================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.92);

            border:
                1px solid #293354;

            border-radius: 14px;

            padding: 20px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.18);
        }

        .stat-label {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #a5b4fc;
        }

        /* ================= APPLICATIONS CARD ================= */

        .applications-card {
            background:
                rgba(15, 23, 42, 0.94);

            border:
                1px solid #293354;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.22);
        }

        .card-header {
            padding: 22px 25px;

            border-bottom:
                1px solid #293354;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .card-header h2 {
            font-size: 20px;
        }

        .count {
            color: #64748b;
            font-size: 13px;
        }

        /* ================= APPLICATION ================= */

        .application {
            padding: 25px;

            border-bottom:
                1px solid #1e293b;

            transition: 0.2s;
        }

        .application:last-child {
            border-bottom: none;
        }

        .application:hover {
            background:
                rgba(99, 102, 241, 0.045);
        }

        .application-top {
            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 20px;

            margin-bottom: 18px;
        }

        .job-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .job-id {
            color: #64748b;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .company-text {
            color: #a5b4fc;
            font-size: 13px;
        }

        /* ================= STATUS ================= */

        .status {
            display: inline-block;

            padding: 8px 14px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

            min-width: 100px;

            text-align: center;

            flex-shrink: 0;
        }

        .status-APPLIED {
            color: #60a5fa;

            background:
                rgba(59, 130, 246, 0.12);

            border:
                1px solid rgba(59, 130, 246, 0.25);
        }

        .status-SHORTLISTED {
            color: #4ade80;

            background:
                rgba(34, 197, 94, 0.12);

            border:
                1px solid rgba(34, 197, 94, 0.25);
        }

        .status-REJECTED {
            color: #f87171;

            background:
                rgba(239, 68, 68, 0.12);

            border:
                1px solid rgba(239, 68, 68, 0.25);
        }

        /* ================= DETAILS ================= */

        .details-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 14px;

            margin-bottom: 18px;
        }

        .detail-box {
            background:
                #0f172a;

            border:
                1px solid #293354;

            border-radius: 10px;

            padding: 14px;
        }

        .detail-label {
            display: block;

            color: #64748b;

            font-size: 11px;

            text-transform: uppercase;

            margin-bottom: 6px;
        }

        .detail-value {
            color: #cbd5e1;

            font-size: 13px;

            line-height: 1.45;

            word-break: break-word;
        }

        /* ================= ACTIONS ================= */

        .application-actions {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }

        .view-btn,
        .download-btn {
            padding: 9px 15px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 12px;

            transition: 0.2s;
        }

        .view-btn {
            border:
                1px solid #4f46e5;

            background: transparent;

            color: #a5b4fc;
        }

        .view-btn:hover {
            background: #4f46e5;
            color: white;
        }

        .download-btn {
            border:
                1px solid #334155;

            background: #111827;

            color: #cbd5e1;
        }

        .download-btn:hover {
            border-color: #818cf8;
            color: #c7d2fe;
        }

        /* ================= EMPTY / LOADING ================= */

        .loading {
            text-align: center;

            padding: 60px;

            color: #64748b;
        }

        .empty {
            text-align: center;

            padding: 70px 30px;

            color: #64748b;
        }

        .empty-title {
            font-size: 20px;

            color: #cbd5e1;

            margin-bottom: 10px;
        }

        .browse-btn {
            display: inline-block;

            margin-top: 18px;

            padding: 10px 18px;

            border-radius: 8px;

            background: #4f46e5;

            color: white;

            text-decoration: none;

            font-size: 13px;
        }

        .error {
            text-align: center;

            padding: 50px;

            color: #f87171;

            line-height: 1.7;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 900px) {

            .details-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media (max-width: 700px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .application-top {
                flex-direction: column;
            }

            .details-grid {
                grid-template-columns: 1fr;
            }

            .status {
                width: fit-content;
            }

            .nav-links a:not(.logout) {
                display: none;
            }

            .page-header h1 {
                font-size: 29px;
            }

        }

        @media (max-width: 500px) {

            .container {
                width: 92%;
                margin-top: 35px;
            }

            .application {
                padding: 20px;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav>

    <div class="logo">
        Hire<span>Hub</span>
    </div>

    <div class="nav-links">

        <a href="jobs.html">
            Jobs
        </a>

        <a
            href="applications.html"
            class="active">
            My Applications
        </a>

        <a href="profile.html">
            Profile
        </a>

        <a
            class="logout"
            onclick="logout()">
            Logout
        </a>

    </div>

</nav>


<!-- ================= MAIN ================= -->

<div class="container">


    <div class="page-header">

        <h1>
            My <span>Applications</span>
        </h1>

        <p>
            Track your applications and monitor
            your recruitment progress.
        </p>

    </div>


    <!-- ================= STATS ================= -->

    <div class="stats">

        <div class="stat-card">

            <div class="stat-label">
                Total Applications
            </div>

            <div
                id="totalCount"
                class="stat-number">
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Shortlisted
            </div>

            <div
                id="shortlistedCount"
                class="stat-number">
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Rejected
            </div>

            <div
                id="rejectedCount"
                class="stat-number">
                0
            </div>

        </div>

    </div>


    <!-- ================= APPLICATIONS ================= -->

    <div class="applications-card">

        <div class="card-header">

            <h2>
                Application History
            </h2>

            <div
                id="applicationCount"
                class="count">
                Loading...
            </div>

        </div>


        <div id="applicationsList">

            <div class="loading">
                Loading applications...
            </div>

        </div>

    </div>


</div>


<script>

/* =========================================================
   LOGIN / SEEKER INITIALIZATION
========================================================= */

let user =
    JSON.parse(
        localStorage.getItem("user")
    );

let seekerId = null;


/* =========================================================
   INITIALIZE USER

   New login response:
   userId = 3
   seekerId = 2

   Older localStorage data may not contain seekerId.
   In that case recover it from the backend.
========================================================= */

async function initializeUser() {

    if (
        !user ||
        !user.userId
    ) {

        window.location.href =
            "login.html";

        return false;
    }


    /*
     * Case 1:
     * seekerId already exists.
     */

    if (
        user.seekerId !== null &&
        user.seekerId !== undefined &&
        user.seekerId !== ""
    ) {

        seekerId =
            Number(
                user.seekerId
            );

        return (
            Number.isInteger(
                seekerId
            ) &&
            seekerId > 0
        );
    }


    /*
     * Case 2:
     * Recover seekerId using userId.
     */

    try {

        console.log(
            "seekerId missing. Recovering using userId:",
            user.userId
        );


        const response =
            await fetch(
                `/api/job-seekers/user/${encodeURIComponent(
                    user.userId
                )}`
            );


        if (!response.ok) {

            throw new Error(
                "Your Job Seeker profile was not found."
            );

        }


        const seeker =
            await response.json();


        if (
            !seeker ||
            !seeker.seekerId
        ) {

            throw new Error(
                "Your account does not have a valid seeker ID."
            );

        }


        seekerId =
            Number(
                seeker.seekerId
            );


        /*
         * Save corrected user information
         * in localStorage so future pages
         * can use seekerId directly.
         */

        user.seekerId =
            seekerId;


        localStorage.setItem(
            "user",
            JSON.stringify(user)
        );


        console.log(
            "Recovered seekerId:",
            seekerId
        );


        return true;

    }
    catch (error) {

        console.error(
            "Seeker ID recovery error:",
            error
        );


        showError(
            error.message
        );


        return false;
    }

}


/* =========================================================
   SHOW ERROR
========================================================= */

function showError(
    message
) {

    document.getElementById(
        "applicationCount"
    ).textContent =
        "Error";


    document.getElementById(
        "applicationsList"
    ).innerHTML = `

        <div class="error">

            ❌ ${escapeHtml(
                message ||
                "Unable to load your account."
            )}

            <br><br>

            <button
                type="button"
                class="view-btn"
                onclick="logout()">

                Logout and Login Again

            </button>

        </div>

    `;

}


/* =========================================================
   LOAD APPLICATIONS
========================================================= */

async function loadApplications() {

    try {

        console.log(
            "Logged-in user:",
            user
        );

        console.log(
            "Using seekerId:",
            seekerId
        );


        const response =
            await fetch(
                `/api/applications/seeker/${encodeURIComponent(
                    seekerId
                )}`
            );


        console.log(
            "Application API status:",
            response.status
        );


        if (!response.ok) {

            const contentType =
                response.headers.get(
                    "content-type"
                ) || "";


            let errorMessage =
                "Unable to load applications.";


            if (
                contentType.includes(
                    "application/json"
                )
            ) {

                try {

                    const errorData =
                        await response.json();


                    errorMessage =
                        errorData.message ||
                        errorData.error ||
                        errorMessage;

                }
                catch (error) {

                    console.error(
                        error
                    );

                }

            }


            throw new Error(
                errorMessage
            );
        }


        const applications =
            await response.json();


        console.log(
            "Applications returned:",
            applications
        );


        updateStats(
            applications
        );


        await renderApplications(
            applications
        );


    }
    catch (error) {

        console.error(
            "Application loading error:",
            error
        );


        document.getElementById(
            "applicationsList"
        ).innerHTML = `

            <div class="error">

                ❌ ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


/* =========================================================
   UPDATE STATISTICS
========================================================= */

function updateStats(
    applications
) {

    const total =
        applications.length;


    const shortlisted =
        applications.filter(
            application =>
                application.status ===
                "SHORTLISTED"
        ).length;


    const rejected =
        applications.filter(
            application =>
                application.status ===
                "REJECTED"
        ).length;


    document.getElementById(
        "totalCount"
    ).textContent =
        total;


    document.getElementById(
        "shortlistedCount"
    ).textContent =
        shortlisted;


    document.getElementById(
        "rejectedCount"
    ).textContent =
        rejected;


    document.getElementById(
        "applicationCount"
    ).textContent =
        total +
        (
            total === 1
                ? " application"
                : " applications"
        );

}


/* =========================================================
   GET JOB
========================================================= */

async function getJob(
    jobId
) {

    try {

        const response =
            await fetch(
                `/api/jobs/${encodeURIComponent(
                    jobId
                )}`
            );


        if (!response.ok) {

            return null;

        }


        return await response.json();

    }
    catch (error) {

        console.error(
            "Job API error:",
            error
        );

        return null;

    }

}


/* =========================================================
   GET RESUME
========================================================= */

async function getResume(
    resumeId
) {

    if (
        resumeId === null ||
        resumeId === undefined
    ) {

        return null;

    }


    try {

        const response =
            await fetch(
                `/api/resumes/${encodeURIComponent(
                    resumeId
                )}`
            );


        if (!response.ok) {

            return null;

        }


        return await response.json();

    }
    catch (error) {

        console.error(
            "Resume API error:",
            error
        );

        return null;

    }

}


/* =========================================================
   RENDER APPLICATIONS
========================================================= */

async function renderApplications(
    applications
) {

    const container =
        document.getElementById(
            "applicationsList"
        );


    /*
     * No applications.
     */

    if (
        !applications ||
        applications.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-title">

                    No applications yet

                </div>

                <div>

                    You haven't applied
                    to any jobs yet.

                </div>


                <a
                    href="jobs.html"
                    class="browse-btn">

                    Browse Jobs

                </a>

            </div>

        `;

        return;

    }


    container.innerHTML = `

        <div class="loading">

            Loading job and resume details...

        </div>

    `;


    /*
     * Load job + resume information
     * for all applications.
     */

    const applicationData =
        await Promise.all(

            applications.map(
                async application => {

                    const job =
                        await getJob(
                            application.jobId
                        );


                    const resume =
                        await getResume(
                            application.resumeId
                        );


                    return {
                        application,
                        job,
                        resume
                    };

                }
            )

        );


    container.innerHTML =
        "";


    /*
     * Render applications.
     */

    applicationData.forEach(
        ({
            application,
            job,
            resume
        }) => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "application";


            const status =
                application.status ||
                "APPLIED";


            const jobTitle =
                job &&
                job.title
                    ? job.title
                    : `Job #${application.jobId}`;


            const location =
                job &&
                job.location
                    ? job.location
                    : "Not available";


            const jobType =
                job &&
                job.jobType
                    ? formatJobType(
                        job.jobType
                    )
                    : "Not available";


            const salary =
                job
                    ? `₹${formatSalary(
                        job.minSalary
                    )} - ₹${formatSalary(
                        job.maxSalary
                    )}`
                    : "Not available";


            const resumeName =
                resume &&
                resume.fileName
                    ? resume.fileName
                    : application.resumeId
                        ? `Resume #${application.resumeId}`
                        : "No resume attached";


            row.innerHTML = `

                <!-- ================= TOP ================= -->

                <div class="application-top">


                    <div>


                        <div class="job-title">

                            ${escapeHtml(
                                jobTitle
                            )}

                        </div>


                        <div class="job-id">

                            Application ID:
                            ${application.applicationId}

                        </div>


                        <div class="company-text">

                            HireHub Company

                        </div>


                    </div>


                    <div>

                        <span
                            class="
                                status
                                ${getStatusClass(
                                    status
                                )}
                            ">

                            ${escapeHtml(
                                status
                            )}

                        </span>

                    </div>


                </div>


                <!-- ================= DETAILS ================= -->

                <div class="details-grid">


                    <div class="detail-box">

                        <span class="detail-label">

                            Location

                        </span>

                        <div class="detail-value">

                            📍
                            ${escapeHtml(
                                location
                            )}

                        </div>

                    </div>


                    <div class="detail-box">

                        <span class="detail-label">

                            Job Type

                        </span>

                        <div class="detail-value">

                            ${escapeHtml(
                                jobType
                            )}

                        </div>

                    </div>


                    <div class="detail-box">

                        <span class="detail-label">

                            Salary

                        </span>

                        <div class="detail-value">

                            ${escapeHtml(
                                salary
                            )}

                        </div>

                    </div>


                    <div class="detail-box">

                        <span class="detail-label">

                            Resume

                        </span>

                        <div class="detail-value">

                            📄
                            ${escapeHtml(
                                resumeName
                            )}

                        </div>

                    </div>


                </div>


                <!-- ================= SECOND DETAILS ================= -->

                <div class="details-grid">


                    <div class="detail-box">

                        <span class="detail-label">

                            Applied On

                        </span>

                        <div class="detail-value">

                            ${escapeHtml(
                                formatDate(
                                    application.appliedAt
                                )
                            )}

                        </div>

                    </div>


                    <div class="detail-box">

                        <span class="detail-label">

                            Job ID

                        </span>

                        <div class="detail-value">

                            ${application.jobId}

                        </div>

                    </div>


                    <div class="detail-box">

                        <span class="detail-label">

                            Seeker ID

                        </span>

                        <div class="detail-value">

                            ${application.seekerId}

                        </div>

                    </div>


                    <div class="detail-box">

                        <span class="detail-label">

                            Application ID

                        </span>

                        <div class="detail-value">

                            ${application.applicationId}

                        </div>

                    </div>


                </div>


                <!-- ================= ACTIONS ================= -->

                <div class="application-actions">


                    <button
                        type="button"
                        class="view-btn"
                        onclick="
                            viewJob(
                                ${application.jobId}
                            )
                        ">

                        View Job

                    </button>


                    ${
                        application.resumeId
                            ? `

                                <button
                                    type="button"
                                    class="download-btn"
                                    onclick="
                                        downloadResume(
                                            ${application.resumeId}
                                        )
                                    ">

                                    Download Resume

                                </button>

                              `
                            : ""
                    }


                </div>

            `;


            container.appendChild(
                row
            );

        }
    );

}


/* =========================================================
   STATUS CLASS
========================================================= */

function getStatusClass(
    status
) {

    if (
        status === "SHORTLISTED"
    ) {

        return "status-SHORTLISTED";

    }


    if (
        status === "REJECTED"
    ) {

        return "status-REJECTED";

    }


    return "status-APPLIED";

}


/* =========================================================
   FORMAT JOB TYPE
========================================================= */

function formatJobType(
    value
) {

    if (!value) {

        return "Not available";

    }


    return String(
        value
    )
        .replace(
            /_/g,
            " "
        )
        .toLowerCase()
        .replace(
            /\b\w/g,
            letter =>
                letter.toUpperCase()
        );

}


/* =========================================================
   FORMAT SALARY
========================================================= */

function formatSalary(
    value
) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return "0";

    }


    return Number(
        value
    ).toLocaleString(
        "en-IN"
    );

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(
    value
) {

    if (!value) {

        return "Not available";

    }


    const date =
        new Date(
            value
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return String(
            value
        );

    }


    return date.toLocaleString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =========================================================
   VIEW JOB
========================================================= */

function viewJob(
    jobId
) {

    window.location.href =
        "job-details.html?id=" +
        encodeURIComponent(
            jobId
        );

}


/* =========================================================
   DOWNLOAD RESUME
========================================================= */

function downloadResume(
    resumeId
) {

    window.open(
        `/api/resumes/${encodeURIComponent(
            resumeId
        )}/download`,
        "_blank"
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";
    }


    return String(
        value
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   LOGOUT
========================================================= */

function logout() {

    localStorage.removeItem(
        "user"
    );

    window.location.href =
        "login.html";

}


/* =========================================================
   START PAGE
========================================================= */

(async function startApplicationsPage() {

    const ready =
        await initializeUser();


    if (!ready) {

        return;

    }


    await loadApplications();

})();
